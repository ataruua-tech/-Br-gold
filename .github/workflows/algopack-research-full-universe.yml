              report['requests'] = client.count
              report['finished_at_utc'] = datetime.now(timezone.utc).isoformat()
              directory.mkdir(exist_ok=True)
              (directory / 'manifest.json').write_bytes(acquisition_bytes(report))
              text = '# AlgoPack research acquisition\n\nRead-only. No trading-strategy changes.\n\n' + json.dumps(report, ensure_ascii=False, indent=2)
