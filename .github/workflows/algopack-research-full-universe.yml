              return {'first_trade': first, 'last_trade': last, 'acquisition_start': first or '2022-10-08', 'acquisition_end': end, 'historical_listing_dates_verified': bool(first and last), 'missing_first_trade_is_not_imputed': not bool(first), 'acquisition_bound_interpretation': 'Query range only; the study start is not asserted to be a listing date'}

