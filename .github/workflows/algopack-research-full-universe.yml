              directory = Path('research-evidence')
              mode = os.environ.get('ACQUIRE_MODE', 'probe')
              year = int(os.environ.get('ACQUIRE_YEAR', '2026'))
              report = {'schema': 1, 'source': 'apim.moex.com', 'mode': mode, 'year': year, 'orders_enabled': False, 'signals_generated': False, 'strategy_changed': False, 'exact_agent_replay_ready': False, 'study_end_exclusive': '2026-10-26', 'contract_universe': 'Frozen 63-contract nearest-expiry study windows', 'remaining_exact_replay_gaps': ['Historical executable BID/OFFER at actual decision/receipt time', 'Historical contract economics and full VOLTODAY selection universe', 'Historical publication, runner and notification latency; user read time unknown', 'Confirmed trading calendar; unresolved session gaps are not synthetic zero-volume candles'], 'started_at_utc': datetime.now(timezone.utc).isoformat(), 'errors': [], 'history': []}
              client = Acquisition(directory)
