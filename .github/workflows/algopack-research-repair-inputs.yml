          class AcquisitionStop(RuntimeError):
              pass

          def acquisition_bytes(value):
              return json.dumps(value, ensure_ascii=False, allow_nan=False, sort_keys=True, separators=(',', ':')).encode()

          def acquisition_validate_candles(rows, interval, first, end_exclusive):
              result = {}
              for r in rows:
                  t = bg.parse_iss_time(r['begin'])
                  if t.second or t.microsecond or (interval == 60 and t.minute):
                      raise ValueError('Non-aligned candle boundary')
                  if not first <= t.date() < end_exclusive:
                      raise ValueError('Candle outside requested date range')
                  values = [float(r[k]) for k in ('open', 'high', 'low', 'close', 'volume')]
                  if not all((math.isfinite(v) for v in values)):
                      raise ValueError('Non-finite candle')
                  o, h, low, c, v = values
                  if not 0 < low <= min(o, c) <= max(o, c) <= h or v < 0:
                      raise ValueError('Invalid candle OHLCV')
                  if t in result and result[t] != r:
                      raise ValueError('Conflicting duplicate candle')
                  result[t] = r
              return [result[t] for t in sorted(result)]

          def acquisition_crosscheck(minutes, hours):
              """Missing minutes are not filled; compare with independent source H1."""
              grouped = {}
              for r in minutes:
                  t = bg.parse_iss_time(r['begin']).replace(minute=0)
                  grouped.setdefault(t, []).append(r)
              matches = 0
              problems = []
              for r in hours:
                  stamp = bg.parse_iss_time(r['begin'])
                  if stamp not in grouped:
                      continue
                  part = sorted(grouped[stamp], key=lambda x: x['begin'])
                  actual = [float(part[0]['open']), max((float(x['high']) for x in part)), min((float(x['low']) for x in part)), float(part[-1]['close']), sum((float(x['volume']) for x in part))]
                  expected = [float(r[k]) for k in ('open', 'high', 'low', 'close', 'volume')]
                  if all((math.isclose(a, b, rel_tol=1e-09, abs_tol=1e-08) for a, b in zip(actual, expected))):
                      matches += 1
                  else:
                      problems.append({'begin': stamp.isoformat(), 'm1_ohlcv': actual, 'h1_ohlcv': expected})
              source_hours = {bg.parse_iss_time(r['begin']) for r in hours}
              missing_source = sorted((t.isoformat() for t in grouped if t not in source_hours))
              return {'matching_h1': matches, 'mismatched_h1': len(problems), 'm1_hours_missing_source_h1': len(missing_source), 'missing_source_examples': missing_source[:20], 'examples': problems[:20], 'calendar_coverage_verified': False}

          class Acquisition:

              def __init__(self, directory, fetch=None, spacing=0.5, max_requests=12000):
                  self.directory = Path(directory)
                  self.directory.mkdir(parents=True, exist_ok=True)
                  (self.directory / 'responses').mkdir(exist_ok=True)
                  self.fetch = fetch or bg.get_json
                  self.spacing = spacing
                  self.max_requests = max_requests
                  self.previous = 0.0
                  self.count = 0
                  self.started = time.monotonic()

              def request(self, path, query=None, optional=False):
                  if not path.startswith('/iss/') or '?' in path or '#' in path or ('..' in path):
                      raise ValueError('Only explicit official AlgoPack ISS paths are allowed')
                  if self.count >= self.max_requests or time.monotonic() - self.started > 100 * 60:
                      raise AcquisitionStop('Acquisition budget reached; partial files retained')
                  url = 'https://apim.moex.com' + path
                  if query:
                      url += '?' + urllib.parse.urlencode(query)
                  delay = self.spacing - (time.monotonic() - self.previous)
                  if delay > 0:
                      time.sleep(delay)
                  self.previous = time.monotonic()
                  self.count += 1
                  entry = {'request_number': self.count, 'source': 'apim.moex.com', 'url': url, 'requested_at_utc': datetime.now(timezone.utc).isoformat()}
                  try:
                      payload = self.fetch(url)
                      entry['received_at_utc'] = datetime.now(timezone.utc).isoformat()
                      body = acquisition_bytes(payload)
                      token = os.environ.get('MOEX_ALGOPACK_TOKEN', '')
                      if token and token.encode() in body:
                          raise ValueError('Protected credential in response; refusing to archive')
                      digest = hashlib.sha256(body).hexdigest()
                      name = 'responses/' + str(self.count).zfill(6) + '-' + digest[:16] + '.json.gz'
                      (self.directory / name).write_bytes(gzip.compress(body, mtime=0))
                      entry.update(status='RECEIVED', response_sha256=digest, file=name, timestamp_scope='Response received now; not point-in-time historical availability')
                      return payload
                  except Exception as exc:
                      message = bg.safe_error(exc)
                      entry.update(status='ERROR', error=message)
                      if any((s in message for s in ('HTTP 401', 'HTTP 429'))) or ('HTTP 403' in message and (not optional)):
                          raise AcquisitionStop(message) from None
                      raise
                  finally:
                      with (self.directory / 'requests.jsonl').open('a') as stream:
                          stream.write(json.dumps(entry, ensure_ascii=False, allow_nan=False) + '\n')

              def pages(self, path, section, query):
                  result = []
                  offset = 0
                  previous_page = None
                  for _ in range(2000):
                      doc = self.request(path, {**query, 'start': offset})
                      part = bg.table_rows(doc, section)
                      if not part:
                          return result
                      digest = hashlib.sha256(acquisition_bytes(part)).hexdigest()
                      if previous_page == digest:
                          raise ValueError('Pagination did not advance; cannot claim complete history')
                      previous_page = digest
                      result.extend(part)
                      offset += len(part)
                  raise AcquisitionStop('Pagination limit reached; partial response files retained')

              def candles(self, code, interval, first, end_exclusive):
                  if not re.fullmatch('(BR|GD)[FGHJKMNQUVXZ][0-9]+', code):
                      raise ValueError('A real BR/GOLD contract code is required')
                  path = '/iss/engines/futures/markets/forts/boards/rfud/securities/' + code + '/candles.json'
                  rows = self.pages(path, 'candles', {'interval': interval, 'from': first.isoformat(), 'till': (end_exclusive - timedelta(days=1)).isoformat(), 'iss.meta': 'off'})
                  return acquisition_validate_candles(rows, interval, first, end_exclusive)

              def save(self, filename, value):
                  body = acquisition_bytes(value)
                  self.directory.joinpath(filename).write_bytes(gzip.compress(body, mtime=0))
                  return {'file': filename, 'uncompressed_sha256': hashlib.sha256(body).hexdigest(), 'rows': len(value) if isinstance(value, list) else None}

          def acquisition_probe(client, contracts, year):
              relevant = [c for c in contracts if c['active_start'] < str(year + 1) + '-01-01' and c['active_end'] > str(year) + '-01-01']
              report = {'year': year, 'source': 'apim.moex.com', 'assets': {}, 'm1_available': False}
              for asset in ('BR', 'GOLD'):
                  choices = sorted((c for c in relevant if c['asset'] == asset), key=lambda c: c['active_start'])
                  if not choices:
                      raise ValueError('No frozen study contract for ' + asset)
                  c = choices[0]
                  day = date.fromisoformat(c['last_h1'][:10])
                  bars = client.candles(c['secid'], 1, day, day + timedelta(days=1))
                  report['assets'][asset] = {'contract': c['secid'], 'date': day.isoformat(), 'm1_rows': len(bars), 'status': 'AVAILABLE' if bars else 'NO_ROWS_ON_KNOWN_H1_DATE'}
                  for metric in ('tradestats', 'obstats'):
                      try:
                          doc = client.request('/iss/datashop/algopack/fo/' + metric + '/' + c['secid'] + '.json', {'from': day.isoformat(), 'till': day.isoformat(), 'iss.meta': 'off', 'start': 0}, optional=True)
                          rows = bg.table_rows(doc, 'data')
                          report['assets'][asset][metric] = {'status': 'AVAILABLE' if rows else 'NO_ROWS', 'sample_rows': len(rows), 'columns': doc['data']['columns'], 'scope': 'Aggregates; not historical tick-level executable BID/OFFER'}
                      except AcquisitionStop:
                          raise
                      except Exception as exc:
                          report['assets'][asset][metric] = {'status': 'UNVERIFIED', 'error': bg.safe_error(exc)}
              report['m1_available'] = all((x['status'] == 'AVAILABLE' for x in report['assets'].values()))
              return report

          def acquisition_history(client, contracts, year):
              start = date(year, 1, 1)
              end = min(date(year + 1, 1, 1), date(2026, 10, 26))
              report = []
              for c in contracts:
                  first = max(start, date.fromisoformat(c['active_start']))
                  last = min(end, date.fromisoformat(c['active_end']) + timedelta(days=7), date.fromisoformat(c['expires']) + timedelta(days=1))
                  if first >= last:
                      continue
                  try:
                      minute = client.candles(c['secid'], 1, first, last)
                      if not minute:
                          raise ValueError('No M1 rows in a nonempty frozen H1 study window')
                      warmup = max(first - timedelta(days=85), date.fromisoformat(c['first_trade'] or first.isoformat()))
                      hourly = client.candles(c['secid'], 60, warmup, last)
                      if not hourly:
                          raise ValueError('No source H1 for M1 cross-check')
                      files = [client.save(c['secid'] + '-M1.json.gz', minute), client.save(c['secid'] + '-H1.json.gz', hourly)]
                      cross = acquisition_crosscheck(minute, hourly)
                      covered = {bg.parse_iss_time(r['begin']).replace(minute=0) for r in minute}
                      missing = [r['begin'] for r in hourly if first <= bg.parse_iss_time(r['begin']).date() < last and bg.parse_iss_time(r['begin']) not in covered and (float(r['volume']) > 0)]
                      report.append({'contract': c['secid'], 'first': first.isoformat(), 'end_exclusive': last.isoformat(), 'status': 'ACQUIRED' if cross['matching_h1'] and (not cross['mismatched_h1']) and (not cross['m1_hours_missing_source_h1']) and (not missing) else 'COVERAGE_ERROR', 'files': files, 'crosscheck': cross, 'nonempty_h1_missing_all_m1': len(missing), 'missing_examples': missing[:20]})
                  except AcquisitionStop:
                      raise
                  except Exception as exc:
                      report.append({'contract': c['secid'], 'status': 'ERROR', 'error': bg.safe_error(exc)})
                  client.save('history-progress.json.gz', report)
              path = '/iss/statistics/engines/futures/markets/indicativerates/securities/USD/RUB.json'
              rates = client.pages(path, 'securities', {'from': (start - timedelta(days=14)).isoformat(), 'till': (end - timedelta(days=1)).isoformat(), 'iss.meta': 'off'})
              if not rates:
                  raise ValueError('No historical indicative FX returned')
              client.save('USD-RUB-rates.json.gz', rates)
              return report

