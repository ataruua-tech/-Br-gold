              return {'status': 'ERROR' if all_errors else 'PASSED', 'source': 'apim.moex.com', 'mode': 'VIRTUAL_ONLY', 'orders_enabled': False, 'ledger_saved': True, 'receipt': receipt, 'portfolios': summary, 'events': details['events'], 'errors': all_errors, 'provenance': provenance, 'valuation': details['valuation'], 'market_delivery': market_delivery, 'replay_archive': replay_receipt, 'week': {**week_details, 'id': week['id'], 'started_at_utc': week['started_at_utc'], 'ends_at_utc': week['ends_at_utc'], 'portfolios': {name: {'equity_rub': p['equity'], 'closed_trades': p['closed_count'], 'open_positions': len(p['positions']), 'max_drawdown_pct': 100 * p['max_drawdown']} for name, p in week['book']['portfolios'].items()}}}

          def control_archive_replay(payload):
              body = json.dumps(payload, ensure_ascii=False, allow_nan=False, sort_keys=True, separators=(',', ':')).encode()
              for name in ('GH_TOKEN', 'GITHUB_TOKEN', 'MOEX_ALGOPACK_TOKEN', 'TELEGRAM_BOT_TOKEN'):
                  value = os.environ.get(name, '')
                  if value and value.encode() in body:
                      raise ControlError('Protected credential detected; refusing to archive')
              directory = Path('control-evidence/replay')
              directory.mkdir(parents=True, exist_ok=True)
              digest = hashlib.sha256(body).hexdigest()
              path = directory / (digest + '.json.gz')
              path.write_bytes(gzip.compress(body, mtime=0))
              return {'file': str(path), 'uncompressed_sha256': digest, 'schema': 1, 'controller_run_id': payload.get('controller_run_id')}

