                  replay.update(phase='COMPLETED_AFTER_CHECKPOINT', expected_week=week, expected_baseline_events=details['events'], expected_week_events=week_details['events'], ledger_receipt=receipt, market_delivery=market_delivery, week_deliveries=week_details.get('deliveries', []), completed_at_utc=datetime.now(timezone.utc).isoformat(), timestamp_scope='Exact inputs and decision clocks used by this controller; Telegram receipt is server acceptance, not user read time')
                  try:
