          cc = sys.modules[__name__]

          NOTIFY_REPO = 'ataruua-tech/-Br-gold'

          NOTIFY_BRANCH = 'telegram-ledger'

          NOTIFY_PATH = 'telegram-state.json'

          NOTIFY_LEDGER_LIMIT = 10000

          class NotifyError(RuntimeError):
              pass

          def notify_safe_error(exc):
              value = bg.safe_error(exc)
              for key in ('GH_TOKEN', 'GITHUB_TOKEN', 'TELEGRAM_PAIR_CODE'):
                  secret = os.environ.get(key, '')
                  if secret:
                      value = value.replace(secret, '[REDACTED]')
              return value

          def notify_json(raw):
              return json.loads(raw, parse_constant=lambda _: (_ for _ in ()).throw(NotifyError('Non-finite JSON')))

          class NotifyAPI:
              """GitHub permissions narrowed to one isolated notification-ledger branch."""

              def __init__(self, token):
                  if not token:
                      raise NotifyError('Missing short-lived GitHub Actions token')
                  self.token = token

              def api(self, suffix, method='GET', body=None, missing=False, artifact=False):
                  if not suffix.startswith('/') or '..' in suffix or method not in ('GET', 'POST', 'PUT'):
                      raise NotifyError('Unexpected GitHub operation')
                  if method == 'PUT' and (suffix != '/contents/' + NOTIFY_PATH or (body or {}).get('branch') != NOTIFY_BRANCH):
                      raise NotifyError('Only the Telegram ledger may be updated')
                  if method == 'POST':
                      if suffix not in ('/git/refs', '/git/blobs', '/git/trees', '/git/commits'):
                          raise NotifyError('Notification workflow cannot dispatch jobs or orders')
                      if suffix == '/git/refs' and (body or {}).get('ref') != 'refs/heads/' + NOTIFY_BRANCH:
                          raise NotifyError('Only the Telegram ledger branch may be created')
                      if suffix == '/git/trees' and ('base_tree' in (body or {}) or [x.get('path') for x in (body or {}).get('tree', [])] != [NOTIFY_PATH]):
                          raise NotifyError('Initial tree must contain only the Telegram ledger')
                      if suffix == '/git/commits' and (body or {}).get('parents') != []:
                          raise NotifyError('Initial ledger commit must be isolated')
                  headers = {'Authorization': 'Bearer ' + self.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'BR-GOLD-Telegram/1'}
                  data = None if body is None else json.dumps(body, allow_nan=False).encode()
                  if data is not None:
                      headers['Content-Type'] = 'application/json'
                  request = urllib.request.Request('https://api.github.com/repos/' + NOTIFY_REPO + suffix, data=data, headers=headers, method=method)
                  opener = urllib.request.build_opener(bg.NoRedirect())
                  try:
                      with opener.open(request, timeout=30) as response:
                          raw = response.read(5000001)
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404 and missing:
                          return None
                      if exc.code in (301, 302, 303, 307, 308) and artifact:
                          target = exc.headers.get('Location', '')
                          parsed = urllib.parse.urlsplit(target)
                          allowed = parsed.hostname and any((parsed.hostname.endswith(s) for s in ('.blob.core.windows.net', '.actions.githubusercontent.com', '.githubusercontent.com')))
                          if parsed.scheme != 'https' or not allowed or parsed.username or (parsed.port not in (None, 443)):
                              raise NotifyError('Unexpected artifact-storage redirect') from None
                          with opener.open(target, timeout=30) as response:
                              raw = response.read(5000001)
                      else:
                          raise NotifyError('GitHub HTTP ' + str(exc.code) + ' during ' + method + ' ' + suffix.split('?')[0]) from None
                  if len(raw) > 5000000:
                      raise NotifyError('GitHub response exceeds bounded size')
                  if artifact:
                      return raw
                  return notify_json(raw) if raw else {}

          def notify_new_state():
              return {'schema': 1, 'deliveries': {}, 'acceptance': {}}

          def notify_validate_state(state):
              if state.get('schema') != 1 or not isinstance(state.get('deliveries'), dict) or (not isinstance(state.get('acceptance'), dict)):
                  raise NotifyError('Invalid Telegram ledger; refusing to reset notification history')
              if len(state['deliveries']) > NOTIFY_LEDGER_LIMIT:
                  raise NotifyError('Telegram ledger limit reached; manual archival is required')
              for key, value in state['deliveries'].items():
                  if not isinstance(key, str) or not isinstance(value, dict) or value.get('status') not in ('INTENT', 'SENT', 'UNCERTAIN'):
                      raise NotifyError('Corrupt Telegram delivery record')

          class NotifyLedger:

              def __init__(self, api):
                  self.api = api
                  ref = api.api('/git/ref/heads/' + NOTIFY_BRANCH, missing=True)
                  self.new = ref is None
                  self.sha = None
                  self.state = notify_new_state()
                  if not self.new:
                      doc = api.api('/contents/' + NOTIFY_PATH + '?ref=' + NOTIFY_BRANCH)
                      if doc.get('encoding') != 'base64':
                          doc = api.api('/git/blobs/' + doc['sha'])
                      if doc.get('encoding') != 'base64':
                          raise NotifyError('Telegram ledger contents unavailable')
                      self.state = notify_json(base64.b64decode(doc['content']))
                      self.sha = doc['sha']
                  notify_validate_state(self.state)

              def save(self):
                  notify_validate_state(self.state)
                  raw = (json.dumps(self.state, ensure_ascii=False, allow_nan=False, indent=2) + '\n').encode()
                  if len(raw) > 4000000:
                      raise NotifyError('Telegram ledger size limit reached')
                  if self.new:
                      blob = self.api.api('/git/blobs', 'POST', {'content': raw.decode(), 'encoding': 'utf-8'})
                      tree = self.api.api('/git/trees', 'POST', {'tree': [{'path': NOTIFY_PATH, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}]})
                      commit = self.api.api('/git/commits', 'POST', {'message': 'Initialize Telegram delivery ledger', 'tree': tree['sha'], 'parents': []})
                      ref = self.api.api('/git/refs', 'POST', {'ref': 'refs/heads/' + NOTIFY_BRANCH, 'sha': commit['sha']})
                      if ref.get('object', {}).get('sha') != commit['sha']:
                          raise NotifyError('Initial Telegram ledger checkpoint not confirmed')
                      self.new = False
                      self.sha = blob['sha']
                  else:
                      result = self.api.api('/contents/' + NOTIFY_PATH, 'PUT', {'message': 'Checkpoint Telegram delivery intent [skip ci]', 'branch': NOTIFY_BRANCH, 'sha': self.sha, 'content': base64.b64encode(raw).decode()})
                      if not result.get('commit', {}).get('sha') or not result.get('content', {}).get('sha'):
                          raise NotifyError('Telegram ledger checkpoint not confirmed')
                      self.sha = result['content']['sha']

          def notify_code_digest():
              if NOTIFY_CODE_SHA256:
                  return NOTIFY_CODE_SHA256
              root = Path(__file__).parent
              return hashlib.sha256(b''.join(((root / name).read_bytes() for name in ('telegram_notify.py', 'br_gold_signals.py', 'moex_tls.py', 'cloud_control.py', 'paper_engine.py')))).hexdigest()

          def notify_configuration():
              token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
              chat = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
              if not token or not chat:
                  raise NotifyError('Add protected GitHub Secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID; never paste them in chat or code')
              if not re.fullmatch('[1-9][0-9]*:[A-Za-z0-9_-]+', token) or not re.fullmatch('-?[1-9][0-9]*', chat):
                  raise NotifyError('Invalid Telegram secret format; TELEGRAM_CHAT_ID must be a numeric chat ID')
              digest = hashlib.sha256(json.dumps([notify_code_digest(), token, chat], separators=(',', ':')).encode()).hexdigest()
              return (token, chat, digest)

          def notify_telegram_api(method, payload, token):
              if method not in ('sendMessage', 'getUpdates'):
                  raise NotifyError('Unexpected Telegram method')
              body = json.dumps(payload, ensure_ascii=False).encode()
              request = urllib.request.Request('https://api.telegram.org/bot' + token + '/' + method, data=body, headers={'Content-Type': 'application/json'}, method='POST')
              try:
                  with urllib.request.build_opener(bg.NoRedirect()).open(request, timeout=20) as response:
                      raw = response.read(1000001)
                      if len(raw) > 1000000:
                          raise NotifyError('Telegram response exceeds bounded size')
                      result = notify_json(raw)
              except urllib.error.HTTPError as exc:
                  raise NotifyError('Telegram HTTP ' + str(exc.code) + '; delivery not confirmed') from None
              except Exception:
                  raise NotifyError('Telegram response unavailable; delivery not confirmed') from None
              if not isinstance(result, dict) or result.get('ok') is not True:
                  raise NotifyError('Telegram API refused the request')
              return result.get('result')

          def notify_telegram(message, token, chat):
              if not isinstance(message, str) or not 0 < len(message) <= 4096:
                  raise NotifyError('Invalid Telegram message size')
              value = notify_telegram_api('sendMessage', {'chat_id': chat, 'text': message, 'disable_web_page_preview': True}, token)
              if not isinstance(value, dict) or not isinstance(value.get('message_id'), int) or isinstance(value.get('message_id'), bool) or (value['message_id'] <= 0) or (value.get('chat', {}).get('id') != int(chat)):
                  raise NotifyError('Telegram receipt/destination not confirmed')
              return {'message_id': value['message_id'], 'telegram_date': value.get('date')}

          def notify_deliver(ledger, key, message, token, chat, now, metadata=None, sender=None):
              existing = ledger.state['deliveries'].get(key)
              if existing:
                  if existing['status'] != 'SENT':
                      raise NotifyError('Previous delivery is uncertain; automatic repeat blocked: ' + key)
                  return {'status': 'ALREADY_SENT', 'key': key}
              ledger.state['deliveries'][key] = {'status': 'INTENT', 'created_at_msk': now.isoformat(), **(metadata or {})}
              ledger.save()
              try:
                  receipt = (sender or notify_telegram)(message, token, chat)
              except Exception as exc:
                  ledger.state['deliveries'][key].update(status='UNCERTAIN', error=notify_safe_error(exc))
                  ledger.save()
                  raise NotifyError('Telegram delivery uncertain; automatic repeat blocked') from None
              ledger.state['deliveries'][key].update(status='SENT', confirmed_at_msk=now.isoformat(), **receipt)
              ledger.save()
              return {'status': 'SENT', 'key': key, **receipt}

          def notify_require_acceptance(ledger, fingerprint):
              entry = ledger.state['acceptance'].get(fingerprint)
              test = ledger.state['deliveries'].get('test:' + fingerprint, {})
              if not entry or test.get('status') != 'SENT' or entry.get('message_id') != test.get('message_id'):
                  raise NotifyError('Telegram is not verified for this code and destination: run workflow mode=test first')

          def notify_test(ledger, token, chat, fingerprint, now, sender=None):
              result = notify_deliver(ledger, 'test:' + fingerprint, '✅ BR/GOLD — тест доставки Telegram.\nКанал подключён. Это технический тест, а не торговый сигнал.\nРыночные сигналы отправляются только после проверки AlgoPack H1/H4. Сделки не исполняются.', token, chat, now, {'kind': 'TEST'}, sender)
              record = ledger.state['deliveries']['test:' + fingerprint]
              if fingerprint not in ledger.state['acceptance']:
                  ledger.state['acceptance'][fingerprint] = {'message_id': record['message_id'], 'verified_at_msk': now.isoformat(), 'code_sha256': notify_code_digest()}
                  ledger.save()
              return result

          def notify_select_run(api, event_run_id=None):
              runs = cc.control_runs(api)
              if not runs:
                  raise NotifyError('No H1 workflow runs on main')
              run = runs[0]
              if event_run_id is not None and run['id'] != event_run_id:
                  return None
              if run.get('head_repository', {}).get('full_name', NOTIFY_REPO) != NOTIFY_REPO:
                  raise NotifyError('Unexpected source repository')
              cc.control_verify_tree(api, run['head_sha'])
              if run['status'] != 'completed':
                  raise NotifyError('Newest H1 run is still queued/running')
              if run.get('conclusion') != 'success':
                  raise NotifyError('Newest H1 run failed; an older success cannot replace it')
              return run

          def notify_validate_signal(value, now):
              local = now.astimezone(bg.MSK).replace(tzinfo=None)
              cc.pe.paper_validate_asset(value, local)
              code = value['contract']
              if not re.fullmatch('[A-Za-z0-9]{3,20}', code):
                  raise NotifyError('Invalid real contract code')
              if not isinstance(value.get('close'), (int, float)) or isinstance(value['close'], bool) or (not math.isfinite(value['close'])) or (value['close'] <= 0):
                  raise NotifyError('Invalid reported H1 close')
              if value['status'] not in ('LONG', 'SHORT', 'ENTRY_CANCELLED'):
                  return
              setup = value['setup']
              direction = setup.get('direction') if value['status'] == 'ENTRY_CANCELLED' else value['status']
              if direction not in ('LONG', 'SHORT'):
                  raise NotifyError('Invalid cancelled setup direction')
              side = 'BUY' if direction == 'LONG' else 'SELL'
              expected = code + ':' + side + ':' + bg.parse_iss_time(value['last_h1_msk']).isoformat()
              if setup['uid'] != expected or setup.get('direction') != direction:
                  raise NotifyError('Setup UID/direction does not match this contract and H1')
              if not math.isclose(setup['entry'], value['close'], rel_tol=0, abs_tol=1e-09):
                  raise NotifyError('Setup entry is not the reported H1 close')
              if value['status'] == 'ENTRY_CANCELLED':
                  return
              quote = value['quote']['offer' if side == 'BUY' else 'bid']
              if abs(quote - setup['entry']) > 0.5 * value['indicators']['atr14']:
                  raise NotifyError('Source quote drift exceeds 0.5 ATR')

          def notify_render_signal(value, provenance):
              start = bg.parse_iss_time(value['last_h1_msk'])
              end = start + timedelta(hours=1)
              setup = value['setup']
              quote = bg.parse_iss_time(value['quote']['time_msk'])
              channel = 'максимума' if value['status'] == 'LONG' else 'минимума'
              return ('🟢 ' if value['status'] == 'LONG' else '🔴 ') + value['status'] + ' · ' + value['asset'] + ' · ' + value['contract'] + f"\nH1: {start:%d.%m.%Y %H:%M}–{end:%H:%M} МСК\nВход по закрытию H1: {setup['entry']:g}\nСтоп: {setup['stop']:g} · Цель: {setup['target']:g}\nПробой Donchian20 {channel}, EMA20/50 H1+H4, ADX14={value['indicators']['adx14']:.1f}, объём подтверждён.\nКотировка из расчёта: {quote:%d.%m.%Y %H:%M:%S} МСК.\nВход — расчётный уровень, текущая цена исполнения может отличаться.\nЭкспериментальная стратегия. Автоматического исполнения нет.\n" + provenance['run_url']

          def notify_no_signal_reason(value):
              """Explain a failed frozen entry condition, never an invented probability."""
              i, f = (value['indicators'], value['filters'])
              h1 = i['ema20'] - i['ema50']
              h4 = i['h4_ema20'] - i['h4_ema50']
              if h1 * h4 <= 0:
                  return 'EMA20/50 H1 и H4 не подтверждают одно направление'
              if i['adx14'] < 22:
                  return f"ADX14={i['adx14']:.2f} ниже 22"
              if f.get('volume') is not True:
                  return 'объём ниже фильтра стратегии'
              if f.get('breakout_up' if h1 > 0 else 'breakout_down') is not True:
                  return 'нет пробоя Donchian20 по направлению тренда'
              return 'расчёт не подтвердил вход; требуется проверка результата'

          def notify_render_summary(assets, provenance, now):
              """Only call with independently replayed, current BR and GOLD results."""
              start = bg.parse_iss_time(assets['BR']['last_h1_msk'])
              end = start + timedelta(hours=1)
              local = now.astimezone(bg.MSK)
              no_signal = all((assets[a]['status'] == 'NO_SIGNAL' for a in ('BR', 'GOLD')))
              lines = ['⚪ СИГНАЛОВ НЕТ' if no_signal else '📋 Сводка BR/GOLD', f'Проверка: {local:%d.%m.%Y %H:%M:%S} МСК', f'H1: {start:%d.%m.%Y %H:%M}–{end:%H:%M} МСК']
              for asset in ('BR', 'GOLD'):
                  value = assets[asset]
                  if value['status'] == 'NO_SIGNAL':
                      reason = notify_no_signal_reason(value)
                  elif value['status'] == 'ENTRY_CANCELLED':
                      reason = 'вход отменён; уровни входа не публикуются'
                  else:
                      reason = value['status'] + '; уровни в отдельном уведомлении о сигнале'
                  lines.append(f"{asset} · {value['contract']} · закрытие {value['close']:g}: {reason}.")
                  quote = bg.parse_iss_time(value['quote']['time_msk'])
                  lines.append(f'Котировка {asset}: {quote:%d.%m.%Y %H:%M:%S} МСК.')
              lines += ['Расчёт по закрытой H1 с буфером 18 минут. Это время расчётной свечи, не текущая цена. Автоматического исполнения нет.', provenance['run_url']]
              return '\n'.join(lines)

          def notify_publish(api, ledger, token, chat, fingerprint, now, event_run_id=None, sender=None):
              notify_require_acceptance(ledger, fingerprint)
              try:
                  run = notify_select_run(api, event_run_id)
                  if run is None:
                      return {'status': 'SUPERSEDED', 'deliveries': []}
                  local = now.astimezone(bg.MSK).replace(tzinfo=None)
                  assets, provenance, replay_errors = cc.control_read_evidence(api, run, local)
              except Exception as exc:
                  key = 'error:' + now.astimezone(bg.MSK).strftime('%Y-%m-%dT%H') + ':SYSTEM'
                  error = notify_safe_error(exc)
                  local = now.astimezone(bg.MSK).replace(tzinfo=None)
                  expected = cc.pe.paper_expected_h1(local)
                  receipt = notify_deliver(ledger, key, f'⚠️ ПРОВЕРКА НЕ УДАЛАСЬ\nПроверка: {local:%d.%m.%Y %H:%M:%S} МСК. Ожидается H1: {expected:%d.%m.%Y %H:%M}–{expected + timedelta(hours=1):%H:%M}.\n' + error + '\nhttps://github.com/' + NOTIFY_REPO + '/actions/workflows/algopack-h1.yml', token, chat, now, {'kind': 'ERROR'}, sender)
                  return {'status': 'DATA_ERRORS', 'errors': [error], 'deliveries': [receipt]}
              result = {'status': 'CHECKED', 'source': provenance, 'deliveries': [], 'assets': {}, 'replay_errors': replay_errors}
              for asset in ('BR', 'GOLD'):
                  value = assets.get(asset)
                  try:
                      if not value or value.get('asset') != asset:
                          raise NotifyError('Missing/incorrect asset result')
                      notify_validate_signal(value, now)
                      status = value['status']
                  except Exception as exc:
                      error = notify_safe_error(exc)
                      result['assets'][asset] = {'status': 'DATA_ERROR', 'errors': [error]}
                      key = 'error:' + now.astimezone(bg.MSK).strftime('%Y-%m-%dT%H') + ':' + asset
                      expected = cc.pe.paper_expected_h1(local)
                      message = '⚠️ ПРОВЕРКА НЕ УДАЛАСЬ · ' + asset + f'\nПроверка: {local:%d.%m.%Y %H:%M:%S} МСК. Ожидается H1: {expected:%d.%m.%Y %H:%M}–{expected + timedelta(hours=1):%H:%M}.\n' + error + '\n' + provenance['run_url']
                      receipt = notify_deliver(ledger, key, message, token, chat, now, {'kind': 'ERROR', 'source_run_id': run['id']}, sender)
                      result['deliveries'].append(receipt)
                      continue
                  result['assets'][asset] = {'status': status, 'contract': value['contract'], 'last_h1_msk': value['last_h1_msk']}
                  if status == 'NO_SIGNAL':
                      continue
                  key = 'signal:' + value['setup']['uid']
                  if status == 'ENTRY_CANCELLED':
                      message = '⚪ Вход отменён · ' + asset + ' · ' + value['contract'] + '\n'
                      message += 'Котировка ушла от уровня H1 более чем на 0,5 ATR либо отсутствует.\n' + provenance['run_url']
                  else:
                      message = notify_render_signal(value, provenance)
                  result['deliveries'].append(notify_deliver(ledger, key, message, token, chat, now, {'kind': status, 'source_run_id': run['id']}, sender))
              if any((v['status'] == 'DATA_ERROR' for v in result['assets'].values())):
                  result['status'] = 'DATA_ERRORS'
              else:
                  key = 'summary:' + assets['BR']['last_h1_msk']
                  result['deliveries'].append(notify_deliver(ledger, key, notify_render_summary(assets, provenance, now), token, chat, now, {'kind': 'SUMMARY', 'source_run_id': run['id'], 'last_h1_msk': assets['BR']['last_h1_msk']}, sender))
              return result

          nt = sys.modules[__name__]
          CONTROL_WEEK_ENGINE_SHA256 = 'ce4b80188eefa457179bb2b5129e6fbc762d701bd6deea6585467e2ac518f932'
          CONTROL_WEEK_COMPATIBLE_ENGINE_SHA256 = 'ce4b80188eefa457179bb2b5129e6fbc762d701bd6deea6585467e2ac518f932'
