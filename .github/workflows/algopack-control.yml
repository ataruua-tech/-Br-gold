# Generated by build_control_workflow.py. Readable Python, no downloaded code.
name: AlgoPack Cloud Control

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/algopack-control.yml']
  schedule:
    - cron: '35,45 * * * *'
  workflow_run:
    workflows: ['AlgoPack H1 BR-GOLD']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: br-gold-cloud-control-v1
  cancel-in-progress: false

jobs:
  control:
    if: github.repository == 'ataruua-tech/-Br-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Supervise reviewed H1 workflow and checkpoint virtual portfolios
        env:
          GH_TOKEN: ${{ github.token }}
          MOEX_ALGOPACK_TOKEN: ${{ secrets.MOEX_ALGOPACK_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import bisect
          import copy
          import functools
          import hashlib
          import io
          import json
          import logging
          import math
          import os
          import ssl
          import statistics
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from dataclasses import dataclass, asdict
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any


          CA_FILES = {'russian_trusted_root_ca_pem.crt': '936a43fea6e8e525bcc0f81acd9c3d21b4fc4b9b68acea7906d698005afc6504', 'russian_trusted_sub_ca_pem.crt': 'f0ae589f36774f29ef3648f7984b08d42fcce6f1ffeeb6236d773daeb2744ea6'}

          class _NoCARedirect(urllib.request.HTTPRedirectHandler):

              def redirect_request(self, *args, **kwargs):
                  return None

          @functools.lru_cache(maxsize=1)
          def moex_context():
              context = ssl.create_default_context()
              bootstrap = urllib.request.build_opener(_NoCARedirect())
              directory = Path(__file__).with_name('certs')
              for filename, expected_hash in CA_FILES.items():
                  path = directory / filename
                  if path.is_file():
                      pem = path.read_bytes()
                  else:
                      url = 'https://gu-st.ru/content/lending/' + filename
                      with bootstrap.open(url, timeout=25) as response:
                          pem = response.read(100000)
                  if hashlib.sha256(pem).hexdigest() != expected_hash:
                      raise RuntimeError('Official CA file changed: ' + filename)
                  context.load_verify_locations(cadata=pem.decode('ascii'))
              return context

          MSK = timezone(timedelta(hours=3))

          ISS = 'https://iss.moex.com/iss/engines/futures/markets/forts/boards/rfud/securities'

          ALGOPACK_ISS = 'https://apim.moex.com/iss/engines/futures/markets/forts/boards/rfud/securities'

          def api_base() -> str:
              """Never silently substitute delayed public ISS for the requested gateway."""
              if not os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip():
                  raise RuntimeError('Missing protected secret MOEX_ALGOPACK_TOKEN')
              return ALGOPACK_ISS

          LOG = logging.getLogger('br_gold_signals')

          LOOKBACK_DAYS = 85

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              """A Bearer header must never follow a redirect to a different host."""

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def safe_urlopen(request, timeout):
              handlers = [NoRedirect()]
              url = request.full_url if isinstance(request, urllib.request.Request) else request
              if urllib.parse.urlsplit(url).hostname == 'apim.moex.com':
                  handlers.append(urllib.request.HTTPSHandler(context=moex_context()))
              return urllib.request.build_opener(*handlers).open(request, timeout=timeout)

          def safe_error(exc: Exception) -> str:
              text = str(exc)
              for name in ('MOEX_ALGOPACK_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID'):
                  secret = os.environ.get(name, '')
                  if secret:
                      text = text.replace(secret, '[REDACTED]')
              return text

          @dataclass(frozen=True)
          class Candle:
              begin: datetime
              open: float
              high: float
              low: float
              close: float
              volume: float

          @dataclass(frozen=True)
          class Contract:
              secid: str
              asset: str
              expires: date
              minstep: float
              stepprice: float
              margin: float
              fee: float
              volume_today: float
              bid: float | None
              offer: float | None
              quote_time: datetime | None = None

          @dataclass(frozen=True)
          class Signal:
              contract: Contract
              side: str
              candle_time: datetime
              entry_reference: float
              stop: float
              target: float
              atr: float
              adx: float
              prior_channel: float
              ema_fast: float
              ema_slow: float
              h4_fast: float
              h4_slow: float

              @property
              def uid(self) -> str:
                  return f'{self.contract.secid}:{self.side}:{self.candle_time.isoformat()}'

          def get_json(url: str, *, timeout: int=18) -> dict[str, Any]:
              headers = {'User-Agent': 'BR-GOLD-SignalResearch/1.1', 'Accept': 'application/json', 'Cache-Control': 'no-cache'}
              token = os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip()
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != 'https' or parsed.hostname not in ('apim.moex.com', 'iss.moex.com') or parsed.username or (parsed.port not in (None, 443)):
                  raise RuntimeError('Unexpected MOEX endpoint')
              if parsed.hostname == 'apim.moex.com':
                  if not token:
                      raise RuntimeError('Missing protected secret MOEX_ALGOPACK_TOKEN')
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(url, headers=headers)
              for attempt in range(3):
                  try:
                      with safe_urlopen(request, timeout=timeout) as response:
                          if response.status != 200:
                              raise RuntimeError(f'MOEX unexpected HTTP {response.status}')
                          data = json.load(response)
                          LOG.info('MOEX HTTP %s: %s', response.status, parsed.path)
                      if not isinstance(data, dict):
                          raise RuntimeError('MOEX API returned non-object JSON')
                      return data
                  except urllib.error.HTTPError as exc:
                      if exc.code == 503:
                          detail = exc.read(4096)
                          if b'upstream connect error' in detail and b'CERTIFICATE_VERIFY_FAILED' in detail:
                              raise RuntimeError('MOEX outbound proxy TLS verification failed (CERTIFICATE_VERIFY_FAILED); check proxy trust/upstream certificate chain. Bearer authorization not verified') from None
                      if exc.code in (401, 403):
                          raise RuntimeError(f'MOEX HTTP {exc.code}: bearer token invalid/expired or subscription lacks access') from None
                      if exc.code == 429:
                          raise RuntimeError('MOEX HTTP 429: rate limit exceeded') from None
                      if attempt == 2:
                          raise RuntimeError(f'MOEX HTTP {exc.code} from official API') from None
                  except (OSError, ValueError) as exc:
                      if attempt == 2:
                          raise RuntimeError(f'MOEX API network/JSON error ({type(exc).__name__})') from None
                  time.sleep(1.5 * (attempt + 1))
              raise AssertionError('unreachable')

          def table_rows(doc: dict[str, Any], name: str) -> list[dict[str, Any]]:
              block = doc.get(name, {})
              columns = block.get('columns')
              data = block.get('data')
              if not isinstance(columns, list) or not isinstance(data, list):
                  raise RuntimeError(f'ISS response lacks {name}.columns/data')
              if len(set(columns)) != len(columns) or any((not isinstance(row, list) or len(row) != len(columns) for row in data)):
                  raise RuntimeError(f'Malformed ISS table {name}')
              return [dict(zip(columns, row)) for row in data]

          def parse_iss_time(value: str) -> datetime:
              """Convert official ISS timestamps into naive Moscow exchange time."""
              dt = datetime.fromisoformat(str(value))
              return dt.astimezone(MSK).replace(tzinfo=None) if dt.tzinfo else dt

          def select_contracts(payload: dict[str, Any], today: date, min_expiry_days: int=9) -> dict[str, Contract]:
              md = {row['SECID']: row for row in table_rows(payload, 'marketdata')}
              eligible: dict[str, list[Contract]] = {'BR': [], 'GOLD': []}
              for row in table_rows(payload, 'securities'):
                  asset = row.get('ASSETCODE')
                  if asset not in eligible or not row.get('LASTTRADEDATE'):
                      continue
                  expires = date.fromisoformat(row['LASTTRADEDATE'])
                  if (expires - today).days < min_expiry_days:
                      continue
                  secid = row['SECID']
                  quote = md.get(secid, {})
                  if any((not math.isfinite(float(row.get(k) or 0)) or float(row.get(k) or 0) <= 0 for k in ('MINSTEP', 'STEPPRICE', 'INITIALMARGIN'))):
                      continue
                  candidate = Contract(secid=secid, asset=asset, expires=expires, minstep=float(row['MINSTEP']), stepprice=float(row['STEPPRICE']), margin=float(row['INITIALMARGIN']), fee=float(row.get('BUYSELLFEE') or 0), volume_today=float(quote.get('VOLTODAY') or 0), bid=float(quote['BID']) if quote.get('BID') is not None else None, offer=float(quote['OFFER']) if quote.get('OFFER') is not None else None, quote_time=parse_iss_time(quote.get('SYSTIME')) if quote.get('SYSTIME') else None)
                  eligible[asset].append(candidate)
              result = {}
              for asset, choices in eligible.items():
                  if not choices:
                      raise RuntimeError(f'No eligible {asset} contract in ISS (expiration buffer {min_expiry_days} days)')
                  result[asset] = max(choices, key=lambda c: (c.volume_today, -c.expires.toordinal()))
              return result

          def download_contracts(now: datetime, min_expiry_days: int) -> dict[str, Contract]:
              fields = 'SECID,ASSETCODE,LASTTRADEDATE,MINSTEP,STEPPRICE,INITIALMARGIN,BUYSELLFEE'
              quotes = 'SECID,VOLTODAY,BID,OFFER,SYSTIME'
              all_sec: list[dict[str, Any]] = []
              all_md: list[dict[str, Any]] = []
              page_size = 1000
              for start in range(0, 30000, page_size):
                  query = {'iss.meta': 'off', 'iss.only': 'securities,marketdata', 'limit': page_size, 'start': start, 'securities.columns': fields, 'marketdata.columns': quotes}
                  payload = get_json(f'{api_base()}.json?{urllib.parse.urlencode(query)}')
                  sec, md = (table_rows(payload, 'securities'), table_rows(payload, 'marketdata'))
                  if not sec:
                      break
                  all_sec.extend(sec)
                  all_md.extend(md)
                  if len(sec) < page_size:
                      break
              else:
                  raise RuntimeError('Contract list exceeded 30 pages')
              if not all_sec:
                  raise RuntimeError('MOEX returned zero securities; wrong permissions or request parameters')
              consolidated = {'securities': {'columns': list(all_sec[0]), 'data': [list(x.values()) for x in all_sec]}, 'marketdata': {'columns': list(all_md[0]) if all_md else ['SECID'], 'data': [list(x.values()) for x in all_md]}}
              return select_contracts(consolidated, now.astimezone(MSK).date(), min_expiry_days)

          def download_candles(secid: str, now: datetime, days: int=LOOKBACK_DAYS) -> list[Candle]:
              local_date = now.astimezone(MSK).date()
              query = {'interval': '60', 'from': (local_date - timedelta(days=days)).isoformat(), 'till': local_date.isoformat(), 'iss.meta': 'off'}
              all_rows: dict[datetime, Candle] = {}
              start = 0
              for _ in range(60):
                  url = f"{api_base()}/{urllib.parse.quote(secid)}/candles.json?{urllib.parse.urlencode({**query, 'start': start})}"
                  rows = table_rows(get_json(url), 'candles')
                  if not rows:
                      break
                  for row in rows:
                      begin = parse_iss_time(str(row['begin']))
                      if any((row.get(k) is None for k in ('open', 'high', 'low', 'close', 'volume'))):
                          raise RuntimeError(f'Candle missing OHLCV for {secid} on {begin}')
                      candle = Candle(begin, float(row['open']), float(row['high']), float(row['low']), float(row['close']), float(row['volume']))
                      if not all((math.isfinite(v) for v in (candle.open, candle.high, candle.low, candle.close, candle.volume))):
                          raise RuntimeError(f'Non-finite OHLCV for {secid}')
                      if not 0 < candle.low <= min(candle.open, candle.close) <= max(candle.open, candle.close) <= candle.high or candle.volume < 0 or begin.minute or begin.second or begin.microsecond or (begin > now.astimezone(MSK).replace(tzinfo=None)):
                          raise RuntimeError(f'Invalid OHLCV for {secid}')
                      if begin in all_rows and all_rows[begin] != candle:
                          raise RuntimeError(f'Conflicting duplicate H1 for {secid} at {begin}')
                      all_rows[begin] = candle
                  start += len(rows)
              else:
                  raise RuntimeError(f'MOEX pagination exceeded 60 pages for {secid}')
              candles = sorted(all_rows.values(), key=lambda c: c.begin)
              if len(candles) < 220:
                  raise RuntimeError(f'Only {len(candles)} H1 candles for {secid}; at least 220 required')
              return candles

          def only_finalized(candles: list[Candle], now: datetime, buffer_minutes: int=18) -> list[Candle]:
              local_naive = now.astimezone(MSK).replace(tzinfo=None)
              return [c for c in candles if c.begin + timedelta(hours=1, minutes=buffer_minutes) <= local_naive]

          def ema(values: list[float], period: int) -> list[float | None]:
              out: list[float | None] = [None] * len(values)
              if period <= 0 or len(values) < period:
                  return out
              previous = statistics.fmean(values[:period])
              out[period - 1] = previous
              factor = 2.0 / (period + 1)
              for i in range(period, len(values)):
                  previous += factor * (values[i] - previous)
                  out[i] = previous
              return out

          def atr_adx(candles: list[Candle], period: int=14) -> tuple[list[float | None], list[float | None]]:
              n = len(candles)
              atr: list[float | None] = [None] * n
              adx: list[float | None] = [None] * n
              if period <= 0:
                  raise ValueError('period must be positive')
              if n < period + 1:
                  return (atr, adx)
              trs = [0.0] * n
              plus = [0.0] * n
              minus = [0.0] * n
              for i in range(1, n):
                  c, p = (candles[i], candles[i - 1])
                  trs[i] = max(c.high - c.low, abs(c.high - p.close), abs(c.low - p.close))
                  up, down = (c.high - p.high, p.low - c.low)
                  plus[i] = up if up > down and up > 0 else 0.0
                  minus[i] = down if down > up and down > 0 else 0.0
              trsum = sum(trs[1:period + 1])
              psum = sum(plus[1:period + 1])
              msum = sum(minus[1:period + 1])
              dx: list[float | None] = [None] * n
              for i in range(period, n):
                  if i > period:
                      trsum = trsum - trsum / period + trs[i]
                      psum = psum - psum / period + plus[i]
                      msum = msum - msum / period + minus[i]
                  atr[i] = trsum / period
                  pdi = 100.0 * psum / trsum if trsum else 0.0
                  mdi = 100.0 * msum / trsum if trsum else 0.0
                  dx[i] = 100 * abs(pdi - mdi) / (pdi + mdi) if pdi + mdi else 0.0
              if n < 2 * period:
                  return (atr, adx)
              adx[2 * period - 1] = statistics.fmean((x for x in dx[period:2 * period] if x is not None))
              for i in range(2 * period, n):
                  adx[i] = (adx[i - 1] * (period - 1) + dx[i]) / period
              return (atr, adx)

          def aggregate_h4(candles: list[Candle]) -> list[Candle]:
              buckets: dict[datetime, list[Candle]] = {}
              for c in candles:
                  bucket = c.begin.replace(hour=c.begin.hour // 4 * 4, minute=0, second=0)
                  buckets.setdefault(bucket, []).append(c)
              result = []
              for stamp in sorted(buckets):
                  bars = sorted(buckets[stamp], key=lambda x: x.begin)
                  if len(bars) != 4 or any((bars[i].begin != stamp + timedelta(hours=i) for i in range(4))):
                      continue
                  result.append(Candle(stamp, bars[0].open, max((c.high for c in bars)), min((c.low for c in bars)), bars[-1].close, sum((c.volume for c in bars))))
              return result

          def indicator_snapshot(candles: list[Candle]) -> dict[str, Any]:
              """An unready H4/indicator is a data error, never a negative trade signal."""
              if len(candles) < 220:
                  raise RuntimeError(f'Only {len(candles)} finalized H1; at least 220 required')
              if any((a.begin >= b.begin for a, b in zip(candles, candles[1:]))):
                  raise RuntimeError('H1 timestamps must be unique and increasing')
              latest = candles[-1]
              h4 = [c for c in aggregate_h4(candles) if c.begin + timedelta(hours=4) <= latest.begin + timedelta(hours=1)]
              if len(h4) < 50:
                  raise RuntimeError(f'Only {len(h4)} complete H4; at least 50 required for EMA50')
              closes = [c.close for c in candles]
              atr, adx = atr_adx(candles)
              earlier = candles[-21:-1]
              result = {'ema20': ema(closes, 20)[-1], 'ema50': ema(closes, 50)[-1], 'atr14': atr[-1], 'adx14': adx[-1], 'donchian20_high': max((c.high for c in earlier)), 'donchian20_low': min((c.low for c in earlier)), 'volume_median20': statistics.median((c.volume for c in earlier)), 'h4_ema20': ema([c.close for c in h4], 20)[-1], 'h4_ema50': ema([c.close for c in h4], 50)[-1]}
              if any((v is None or not math.isfinite(v) for v in result.values())):
                  raise RuntimeError('Indicators are not finite/ready')
              if result['atr14'] <= 0 or not 0 <= result['adx14'] <= 100.000001 or result['volume_median20'] <= 0:
                  raise RuntimeError('ATR/ADX/volume history is unusable')
              return {**result, 'h1_count': len(candles), 'h4_count': len(h4), 'h4_last_begin_msk': h4[-1].begin.isoformat(), 'volume_filter_pass': latest.volume >= 0.6 * result['volume_median20']}

          def latest_is_current(candles: list[Candle], now: datetime) -> None:
              if not candles:
                  raise RuntimeError('No finalized H1 candles')
              boundary = (now.astimezone(MSK).replace(tzinfo=None) - timedelta(minutes=18)).replace(minute=0, second=0, microsecond=0)
              expected = boundary - timedelta(hours=1)
              if candles[-1].begin != expected:
                  raise RuntimeError(f'STALE/missing H1: latest {candles[-1].begin}; expected {expected} MSK. Session may be closed')

          def tick_round(value: float, tick: float) -> float:
              decimals = max(0, len(f'{tick:.10f}'.rstrip('0').split('.')[1]))
              return round(round(value / tick) * tick, decimals)

          def compute_signals(candles: list[Candle], contract: Contract, *, adx_min: float=22.0, channel_length: int=20, atr_stop: float=1.5, reward_multiple: float=2.0) -> list[Signal]:
              if len(candles) < 220:
                  return []
              closes = [c.close for c in candles]
              fast, slow = (ema(closes, 20), ema(closes, 50))
              atrs, adxs = atr_adx(candles)
              h4 = aggregate_h4(candles)
              h4fast, h4slow = (ema([c.close for c in h4], 20), ema([c.close for c in h4], 50))
              h4_pos = 0
              signals: list[Signal] = []
              for i in range(max(100, channel_length), len(candles)):
                  c = candles[i]
                  while h4_pos < len(h4) and h4[h4_pos].begin + timedelta(hours=4) <= c.begin + timedelta(hours=1):
                      h4_pos += 1
                  j = h4_pos - 1
                  if j < 0 or any((v is None for v in (fast[i], slow[i], atrs[i], adxs[i], h4fast[j], h4slow[j]))):
                      continue
                  if adxs[i] < adx_min or atrs[i] <= 0:
                      continue
                  earlier = candles[i - channel_length:i]
                  prior_high = max((x.high for x in earlier))
                  prior_low = min((x.low for x in earlier))
                  median_volume = statistics.median((x.volume for x in earlier))
                  if median_volume <= 0 or c.volume < median_volume * 0.6:
                      continue
                  long = c.close > prior_high and fast[i] > slow[i] and (h4fast[j] > h4slow[j])
                  short = c.close < prior_low and fast[i] < slow[i] and (h4fast[j] < h4slow[j])
                  if not (long or short):
                      continue
                  side = 'BUY' if long else 'SELL'
                  direction = 1 if long else -1
                  risk_distance = float(atrs[i]) * atr_stop
                  stop = tick_round(c.close - direction * risk_distance, contract.minstep)
                  rounded_risk = direction * (c.close - stop)
                  if rounded_risk <= 0 or stop <= 0:
                      continue
                  target = tick_round(c.close + direction * rounded_risk * reward_multiple, contract.minstep)
                  if target <= 0 or direction * (target - c.close) <= 0:
                      continue
                  signals.append(Signal(contract, side, c.begin, c.close, stop, target, float(atrs[i]), float(adxs[i]), prior_high if long else prior_low, float(fast[i]), float(slow[i]), float(h4fast[j]), float(h4slow[j])))
              return signals

          def valid_spread(c: Contract, max_spread_ticks: int=5) -> bool:
              if c.bid is None or c.offer is None or (not all((math.isfinite(v) and v > 0 for v in (c.bid, c.offer)))):
                  return False
              return 0 <= c.offer - c.bid <= c.minstep * max_spread_ticks + 1e-09

          def quote_is_current(c: Contract, now: datetime, max_age_minutes: int=45) -> bool:
              """Fail closed when quote timestamp is absent or too old.

              Allow a publication delay for public ISS, but never treat Friday's quote
              as Monday's executable price. Actual broker execution must be rechecked.
              """
              if c.quote_time is None:
                  return False
              age = now.astimezone(MSK).replace(tzinfo=None) - c.quote_time
              return timedelta(minutes=-5) <= age <= timedelta(minutes=max_age_minutes)

          bg = sys.modules[__name__]

          PAPER_MSK = timezone(timedelta(hours=3))

          PAPER_CONFIG = {'version': 1, 'capital_rub': 100000.0, 'risks': [0.01, 0.02], 'broker_fraction': 0.00015, 'slippage_ticks': 2, 'initial_margin_cap': 0.5, 'drawdown_halt_fraction': 0.2, 'maximum_hold_days': 5, 'publication_buffer_minutes': 18, 'margin_scope': 'Live MOEX exchange margin; broker-specific uplift is not known', 'drawdown_limit_status': 'Provisional demo guard, not a user-approved real-money limit', 'pnl_method': 'Minute price increments at last published indicative FX; fees and fills modeled, exact clearing not reconstructed'}

          def paper_config_hash():
              return hashlib.sha256(json.dumps(PAPER_CONFIG, sort_keys=True).encode()).hexdigest()

          def paper_new_state():
              return {'schema': 1, 'config_hash': paper_config_hash(), 'config': copy.deepcopy(PAPER_CONFIG), 'portfolios': {f'risk_{int(r * 100)}': {'risk': r, 'equity': 100000.0, 'peak': 100000.0, 'max_drawdown': 0.0, 'positions': {}, 'closed': [], 'seen_setups': [], 'halted': None, 'closed_count': 0, 'realized_pnl_sum': 0.0, 'gross_gains': 0.0, 'gross_losses': 0.0, 'wins': 0} for r in PAPER_CONFIG['risks']}, 'events': [], 'observations': [], 'errors': []}

          def paper_validate_state(state):
              if state.get('schema') != 1 or state.get('config_hash') != paper_config_hash():
                  raise ValueError('Paper ledger version/config mismatch; refusing to reset capital')
              if state.get('config') != PAPER_CONFIG or set(state.get('portfolios', {})) != {'risk_1', 'risk_2'}:
                  raise ValueError('Paper ledger configuration/portfolio set changed')
              for name in ('risk_1', 'risk_2'):
                  p = state['portfolios'][name]
                  if not all((math.isfinite(p[k]) for k in ('equity', 'peak', 'max_drawdown'))) or p['peak'] <= 0:
                      raise ValueError('Corrupt paper capital')
                  if p['risk'] != PAPER_CONFIG['risks'][('risk_1', 'risk_2').index(name)]:
                      raise ValueError('Corrupt paper risk')
                  for asset, v in p['positions'].items():
                      if asset not in ('BR', 'GOLD') or v['qty'] < 1 or int(v['qty']) != v['qty']:
                          raise ValueError('Corrupt paper position')
                  expected = PAPER_CONFIG['capital_rub'] + p['realized_pnl_sum'] + sum((v['net'] for v in p['positions'].values()))
                  if not math.isclose(expected, p['equity'], abs_tol=1e-05):
                      raise ValueError('Paper PnL/equity reconciliation failed')

          def paper_time(value):
              t = datetime.fromisoformat(value)
              if t.tzinfo is not None:
                  t = t.astimezone(PAPER_MSK).replace(tzinfo=None)
              return t

          def paper_expected_h1(now):
              return (now - timedelta(minutes=18)).replace(minute=0, second=0, microsecond=0) - timedelta(hours=1)

          def paper_validate_asset(v, now):
              if v.get('source') != 'apim.moex.com' or v.get('data_verified') is not True or v.get('errors'):
                  raise ValueError('Unverified AlgoPack asset')
              if v.get('asset') not in ('BR', 'GOLD') or not isinstance(v.get('contract'), str):
                  raise ValueError('Invalid contract identity')
              if paper_time(v['last_h1_msk']) != paper_expected_h1(now):
                  raise ValueError('Stale H1')
              if (datetime.fromisoformat(v['expires']).date() - now.date()).days < 9:
                  raise ValueError('Contract expiry buffer violated')
              q, f, i = (v['quote'], v['filters'], v['indicators'])
              qt = paper_time(q['time_msk'])
              if not now - timedelta(minutes=45) <= qt <= now + timedelta(minutes=5):
                  raise ValueError('Stale quote in source report')
              if not all((math.isfinite(q[k]) and q[k] > 0 for k in ('bid', 'offer'))) or q['bid'] > q['offer']:
                  raise ValueError('Invalid source bid/offer')
              if f.get('spread') is not True or f.get('quote_current') is not True:
                  raise ValueError('Spread/quote filter failed')
              for key in ('ema20', 'ema50', 'h4_ema20', 'h4_ema50', 'atr14', 'adx14', 'donchian20_high', 'donchian20_low', 'volume_median20'):
                  if not math.isfinite(i[key]):
                      raise ValueError('Non-finite indicator')
              if i['atr14'] <= 0 or not 0 <= i['adx14'] <= 100.000001 or i['volume_median20'] <= 0:
                  raise ValueError('Invalid ATR/ADX/volume')
              status = v.get('status')
              if status not in ('NO_SIGNAL', 'LONG', 'SHORT', 'ENTRY_CANCELLED'):
                  raise ValueError('Data-error/unknown status')
              if status in ('LONG', 'SHORT'):
                  direction = 1 if status == 'LONG' else -1
                  setup = v['setup']
                  if not all((math.isfinite(setup[k]) and setup[k] > 0 for k in ('entry', 'stop', 'target'))):
                      raise ValueError('Invalid setup levels')
                  if direction * (setup['entry'] - setup['stop']) <= 0 or direction * (setup['target'] - setup['entry']) <= 0:
                      raise ValueError('Invalid setup ordering')
                  if not (direction * (i['ema20'] - i['ema50']) > 0 and direction * (i['h4_ema20'] - i['h4_ema50']) > 0 and (i['adx14'] >= 22) and (f.get('volume') is True) and (f.get('breakout_up' if direction == 1 else 'breakout_down') is True)):
                      raise ValueError('Signal fails frozen Donchian rules')
                  if not isinstance(setup.get('uid'), str) or not setup['uid']:
                      raise ValueError('Missing setup UID')

          def paper_validate_contract(c, now):
              for key in ('tick', 'point_value', 'margin', 'exchange_fee', 'bid', 'offer'):
                  if not math.isfinite(c[key]) or c[key] <= 0:
                      raise ValueError('Missing live contract economics: ' + key)
              qt = paper_time(c['quote_time'])
              if not now - timedelta(seconds=90) <= qt <= now + timedelta(minutes=5):
                  raise ValueError('Paper entry needs a fresh independently fetched quote')
              if not c['bid'] <= c['offer'] or c['offer'] - c['bid'] > 5 * c['tick'] + 1e-08:
                  raise ValueError('Paper spread exceeds five ticks')

          def paper_fee(price, point_value, exchange_fraction):
              return abs(price) * point_value * (PAPER_CONFIG['broker_fraction'] + exchange_fraction)

          def paper_fx(rows, stamp):
              values = {}
              for row in rows:
                  when = paper_time(row['time'])
                  value = float(row['rate'])
                  if when in values and values[when] != value:
                      raise ValueError('Conflicting historical FX observations')
                  values[when] = value
              eligible = [(t, r) for t, r in values.items() if t <= stamp]
              if not eligible:
                  raise ValueError('No published historical USD/RUB for minute')
              t, rate = max(eligible)
              if stamp - t > timedelta(days=14) or not math.isfinite(rate) or rate <= 0:
                  raise ValueError('Invalid/missing historical FX')
              return rate

          def paper_mark_risk(p):
              p['peak'] = max(p['peak'], p['equity'])
              p['max_drawdown'] = max(p['max_drawdown'], 1 - p['equity'] / p['peak'])
              if p['max_drawdown'] >= PAPER_CONFIG['drawdown_halt_fraction']:
                  p['halted'] = 'Demo drawdown guard reached; no new virtual entries'

          def paper_process_minutes(p, minutes, rates, now, events, portfolio):
              pending = []
              for asset, pos in p['positions'].items():
                  if pos.get('review_required'):
                      continue
                  entered, cursor = (paper_time(pos['entered']), paper_time(pos['cursor']))
                  for b in minutes.get(pos['contract'], []):
                      begin = paper_time(b['begin'])
                      end = begin + timedelta(minutes=1)
                      if end <= cursor or end + timedelta(minutes=18) > now:
                          continue
                      if begin > now or end <= entered:
                          continue
                      if not all((math.isfinite(b[k]) for k in ('open', 'high', 'low', 'close', 'volume'))):
                          raise ValueError('Non-finite M1')
                      if not 0 < b['low'] <= min(b['open'], b['close']) <= max(b['open'], b['close']) <= b['high'] or b['volume'] < 0:
                          raise ValueError('Invalid M1')
                      pending.append((end, asset, b))
              for end, asset, b in sorted(pending, key=lambda x: (x[0], x[1])):
                  pos = p['positions'].get(asset)
                  if not pos or pos.get('review_required') or end <= paper_time(pos['cursor']):
                      continue
                  direction = pos['direction']
                  begin = paper_time(b['begin'])
                  stop_hit = b['low'] <= pos['stop'] if direction == 1 else b['high'] >= pos['stop']
                  target_hit = b['high'] >= pos['target'] if direction == 1 else b['low'] <= pos['target']
                  if begin < paper_time(pos['entered']) and (stop_hit or target_hit):
                      pos['review_required'] = 'Entry-minute OHLC cannot establish whether the level was touched before or after entry'
                      p['halted'] = pos['review_required']
                      events.append({'portfolio': portfolio, 'type': 'REVIEW_REQUIRED', 'uid': pos['uid'], 'minute': b['begin']})
                      continue
                  if begin < paper_time(pos['entered']):
                      pos['cursor'] = end.isoformat()
                      continue
                  pv = paper_fx(rates, end) * (10 if asset == 'BR' else 1)
                  reason = None
                  raw = b['close']
                  roll_at = datetime.fromisoformat(pos['expires']) - timedelta(days=8)
                  if begin >= roll_at or begin >= paper_time(pos['entered']) + timedelta(days=5):
                      raw = b['open']
                      reason = 'ROLL' if begin >= roll_at else 'TIME'
                  elif stop_hit:
                      raw = min(b['open'], pos['stop']) if direction == 1 else max(b['open'], pos['stop'])
                      reason = 'STOP_FIRST_MODEL' if target_hit else 'STOP'
                  elif target_hit:
                      raw = pos['target']
                      reason = 'TARGET'
                  fill = raw - direction * PAPER_CONFIG['slippage_ticks'] * pos['tick'] if reason else raw
                  commission = paper_fee(fill, pv, pos['exchange_fraction']) * pos['qty'] if reason else 0.0
                  pnl = direction * (fill - pos['last_price']) * pv * pos['qty'] - commission
                  p['equity'] += pnl
                  pos['net'] += pnl
                  pos['last_price'] = raw
                  pos['cursor'] = end.isoformat()
                  if reason:
                      closed = {**pos, 'exit': fill, 'exit_time': end.isoformat(), 'reason': reason, 'pnl_rub': pos['net'], 'pnl_status': 'MODELED_NOT_ACTUAL_FILL', 'net_r': pos['net'] / pos['initial_risk_rub']}
                      p['closed'].append(closed)
                      del p['positions'][asset]
                      p['closed_count'] += 1
                      p['realized_pnl_sum'] += pos['net']
                      p['gross_gains'] += max(0, pos['net'])
                      p['gross_losses'] += max(0, -pos['net'])
                      p['wins'] += int(pos['net'] > 0)
                      p['closed'] = p['closed'][-2000:]
                      events.append({'portfolio': portfolio, 'type': 'CLOSED', 'uid': pos['uid'], 'reason': reason, 'pnl_rub': pos['net']})
                  paper_mark_risk(p)

          def paper_apply(state, assets, contracts, minutes, rates, now, provenance):
              paper_validate_state(state)
              result = copy.deepcopy(state)
              events = []
              errors = []
              good = {}
              for asset, v in assets.items():
                  try:
                      paper_validate_asset(v, now)
                      good[asset] = v
                  except (ValueError, KeyError, TypeError) as exc:
                      errors.append(asset + ': ' + str(exc))
              for name, p in result['portfolios'].items():
                  try:
                      before = copy.deepcopy(p)
                      before_events = len(events)
                      paper_process_minutes(p, minutes, rates, now, events, name)
                  except (ValueError, KeyError, TypeError) as exc:
                      result['portfolios'][name] = before
                      p = before
                      del events[before_events:]
                      errors.append(name + ': ' + str(exc))
                      continue
                  if any((pos['contract'] not in contracts for pos in p['positions'].values())):
                      errors.append(name + ': missing live margin for an existing position')
                      continue
                  used_live = sum((contracts[pos['contract']]['margin'] * pos['qty'] for pos in p['positions'].values()))
                  if used_live and used_live >= p['equity']:
                      p['halted'] = 'Live MOEX margin exceeds virtual equity; broker liquidation is not invented'
                      errors.append(name + ': ' + p['halted'])
                  for asset in ('BR', 'GOLD'):
                      v = good.get(asset)
                      if not v or v['status'] not in ('LONG', 'SHORT', 'ENTRY_CANCELLED'):
                          continue
                      uid = v.get('setup', {}).get('uid')
                      if not uid or uid in p['seen_setups']:
                          continue
                      p['seen_setups'].append(uid)
                      if v['status'] == 'ENTRY_CANCELLED':
                          events.append({'portfolio': name, 'type': 'ENTRY_CANCELLED', 'uid': uid})
                          continue
                      if p['halted'] or asset in p['positions']:
                          events.append({'portfolio': name, 'type': 'SKIPPED', 'uid': uid, 'reason': 'halted/already open'})
                          continue
                      try:
                          c = contracts[v['contract']]
                          paper_validate_contract(c, now)
                          if c['asset'] != asset or c['expires'] != v['expires']:
                              raise ValueError('Live contract/report mismatch')
                          direction = 1 if v['status'] == 'LONG' else -1
                          setup = v['setup']
                          tick = c['tick']
                          quote = c['offer'] if direction == 1 else c['bid']
                          entry = round(round((quote + direction * 2 * tick) / tick) * tick, 8)
                          if abs(entry - setup['entry']) > 0.5 * v['indicators']['atr14']:
                              events.append({'portfolio': name, 'type': 'ENTRY_CANCELLED', 'uid': uid, 'reason': 'fresh quote drift >0.5 ATR'})
                              continue
                          if direction * (entry - setup['stop']) <= 0 or direction * (setup['target'] - entry) <= 0:
                              raise ValueError('Fresh entry is beyond stop/target')
                          exchange_fraction = c['exchange_fee'] / (abs(quote) * c['point_value'])
                          entry_fee = paper_fee(entry, c['point_value'], exchange_fraction)
                          one_risk = (abs(entry - setup['stop']) + 2 * tick) * c['point_value'] + entry_fee + paper_fee(setup['stop'], c['point_value'], exchange_fraction)
                          budget_equity = p['equity']
                          for a, pos in p['positions'].items():
                              cc = contracts.get(pos['contract'])
                              if cc is None:
                                  raise ValueError('Missing live margin for existing position')
                              paper_validate_contract(cc, now)
                              px = cc['bid'] if pos['direction'] == 1 else cc['offer']
                              budget_equity += min(0, pos['direction'] * (px - pos['last_price']) * cc['point_value'] * pos['qty'])
                          used = sum((contracts[pos['contract']]['margin'] * pos['qty'] for pos in p['positions'].values()))
                          qty = max(0, min(math.floor(budget_equity * p['risk'] / one_risk), math.floor(max(0, 0.5 * budget_equity - used) / (c['margin'] + 0.5 * entry_fee)), math.floor(0.01 * v['indicators']['volume_median20'])))
                          if qty < 1:
                              events.append({'portfolio': name, 'type': 'SKIPPED', 'uid': uid, 'reason': 'whole contract does not fit risk/margin/liquidity'})
                              continue
                          p['equity'] -= qty * entry_fee
                          p['positions'][asset] = {'uid': uid, 'contract': v['contract'], 'asset': asset, 'expires': v['expires'], 'direction': direction, 'qty': qty, 'entry': entry, 'stop': setup['stop'], 'target': setup['target'], 'tick': tick, 'entered': now.isoformat(), 'cursor': now.isoformat(), 'last_price': entry, 'net': -qty * entry_fee, 'exchange_fraction': exchange_fraction, 'initial_risk_rub': qty * one_risk, 'entry_fee_rub': qty * entry_fee, 'entry_point_value': c['point_value'], 'margin_per_contract': c['margin'], 'provenance': provenance, 'execution_status': 'VIRTUAL_QUOTE_PLUS_SLIPPAGE'}
                          paper_mark_risk(p)
                          events.append({'portfolio': name, 'type': 'OPENED', 'uid': uid, 'qty': qty, 'risk_rub': qty * one_risk, 'entry': entry, 'stop': setup['stop'], 'target': setup['target']})
                      except (KeyError, ValueError, TypeError) as exc:
                          errors.append(name + ' ' + asset + ': ' + str(exc))
                  p['seen_setups'] = p['seen_setups'][-5000:]
              result['events'] = (result['events'] + [{'time': now.isoformat(), **e} for e in events])[-5000:]
              result['observations'] = (result['observations'] + [{'time': now.isoformat(), 'provenance': provenance, 'statuses': {a: v.get('status') for a, v in assets.items()}}])[-2000:]
              result['errors'] = (result['errors'] + [{'time': now.isoformat(), 'message': e} for e in errors])[-200:]
              result['updated_at_msk'] = now.isoformat()
              paper_validate_state(result)
              return (result, {'events': events, 'errors': errors, 'orders_enabled': False, 'valuation': PAPER_CONFIG['pnl_method']})

          pe = sys.modules[__name__]

          CONTROL_REPO = 'ataruua-tech/-Br-gold'

          CONTROL_WORKFLOW = 'algopack-h1.yml'

          CONTROL_PATH = '.github/workflows/algopack-h1.yml'

          CONTROL_EXPECTED_BLOB = '38e147112ad48c3959b4dff6838fbec88d66f576'

          CONTROL_LEDGER_BRANCH = 'paper-ledger'

          CONTROL_LEDGER_PATH = 'paper-state.json'

          class ControlError(RuntimeError):
              pass

          class ControlAPI:

              def __init__(self, token, repo=CONTROL_REPO):
                  if not token:
                      raise ControlError('Missing short-lived GitHub Actions token')
                  if repo != CONTROL_REPO:
                      raise ControlError('Controller is bound to its reviewed repository')
                  self.token = token
                  self.repo = repo

              def api(self, suffix, method='GET', body=None, missing=False, artifact=False):
                  if not suffix.startswith('/') or '..' in suffix or (not method in ('GET', 'POST', 'PUT')):
                      raise ControlError('Unexpected GitHub operation')
                  if method == 'PUT' and suffix != '/contents/' + CONTROL_LEDGER_PATH:
                      raise ControlError('Only the paper ledger may be written')
                  if method == 'PUT' and (body or {}).get('branch') != CONTROL_LEDGER_BRANCH:
                      raise ControlError('The main branch is not a ledger write target')
                  if method == 'POST' and suffix not in ('/git/refs', '/git/blobs', '/git/trees', '/git/commits', '/actions/workflows/' + CONTROL_WORKFLOW + '/dispatches'):
                      raise ControlError('Unexpected GitHub write endpoint')
                  if method == 'POST' and suffix == '/git/refs' and ((body or {}).get('ref') != 'refs/heads/' + CONTROL_LEDGER_BRANCH):
                      raise ControlError('Only the paper-ledger branch may be created')
                  if method == 'POST' and suffix.endswith('/dispatches') and (body != {'ref': 'main'}):
                      raise ControlError('Only the reviewed main workflow may be dispatched')
                  if method == 'POST' and suffix == '/git/trees' and ([x.get('path') for x in (body or {}).get('tree', [])] != [CONTROL_LEDGER_PATH] or 'base_tree' in (body or {})):
                      raise ControlError('Initial ledger tree must contain only paper-state.json')
                  if method == 'POST' and suffix == '/git/commits' and ((body or {}).get('parents') != []):
                      raise ControlError('Initial ledger commit must be an isolated data commit')
                  url = 'https://api.github.com/repos/' + self.repo + suffix
                  headers = {'Authorization': 'Bearer ' + self.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'BR-GOLD-Cloud-Control/1'}
                  data = json.dumps(body, allow_nan=False).encode() if body is not None else None
                  if data is not None:
                      headers['Content-Type'] = 'application/json'
                  req = urllib.request.Request(url, data=data, headers=headers, method=method)
                  opener = urllib.request.build_opener(bg.NoRedirect())
                  try:
                      with opener.open(req, timeout=30) as response:
                          raw = response.read(5000001)
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404 and missing:
                          return None
                      if exc.code in (301, 302, 303, 307) and artifact:
                          target = exc.headers.get('Location', '')
                          parsed = urllib.parse.urlsplit(target)
                          allowed = parsed.hostname and (parsed.hostname.endswith('.blob.core.windows.net') or parsed.hostname.endswith('.actions.githubusercontent.com') or parsed.hostname.endswith('.githubusercontent.com'))
                          if parsed.scheme != 'https' or not allowed or parsed.username:
                              raise ControlError('Unexpected artifact storage redirect') from None
                          with urllib.request.build_opener(bg.NoRedirect()).open(target, timeout=30) as response:
                              raw = response.read(5000001)
                      else:
                          raise ControlError('GitHub HTTP ' + str(exc.code) + ' during ' + method + ' ' + suffix.split('?')[0]) from None
                  if len(raw) > 5000000:
                      raise ControlError('GitHub response exceeds bounded size')
                  if artifact:
                      return raw
                  if not raw:
                      return {}
                  return json.loads(raw, parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Non-finite JSON')))

          def control_utc(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(timezone.utc)

          def control_cycle(now):
              return (now.astimezone(timezone.utc) - timedelta(minutes=18)).replace(minute=0, second=0, microsecond=0)

          def control_run_cycle(run):
              return control_cycle(control_utc(run.get('run_started_at') or run['created_at']))

          def control_runs(api):
              payload = api.api('/actions/workflows/' + CONTROL_WORKFLOW + '/runs?branch=main&per_page=30')
              return sorted([r for r in payload['workflow_runs'] if r['head_branch'] == 'main' and r['path'] == CONTROL_PATH], key=lambda r: (r['created_at'], r['id']), reverse=True)

          def control_verify_tree(api, sha):
              tree = api.api('/git/trees/' + sha + '?recursive=1')
              if tree.get('truncated'):
                  raise ControlError('Incomplete or unexpected source tree')
              matches = [x for x in tree['tree'] if x['path'] == CONTROL_PATH and x['type'] == 'blob']
              if len(matches) != 1 or matches[0]['sha'] != CONTROL_EXPECTED_BLOB:
                  raise ControlError('Reviewed H1 workflow blob changed; dispatch/entries blocked')

          def control_supervise(api, now):
              runs = control_runs(api)
              cycle = control_cycle(now)
              newest = runs[0] if runs else None
              same = [r for r in runs if control_run_cycle(r) == cycle]
              if newest and newest['status'] != 'completed':
                  return {'status': 'WAITING', 'run_id': newest['id'], 'reason': 'Newest H1 run is queued/running; no replacement by an older run'}
              if same and newest['conclusion'] == 'success':
                  return {'status': 'OK', 'run_id': newest['id'], 'reason': 'H1 run already completed for this publication cycle'}
              if sum((int(r.get('run_attempt', 1)) for r in same)) >= 3:
                  raise ControlError('Three H1 attempts in this cycle already failed; retry limit reached')
              branch = api.api('/git/ref/heads/main')
              head = branch['object']['sha']
              control_verify_tree(api, head)
              api.api('/actions/workflows/' + CONTROL_WORKFLOW + '/dispatches', 'POST', {'ref': 'main'})
              return {'status': 'DISPATCHED', 'cycle_utc': cycle.isoformat(), 'reason': 'Missing/failed current H1 run; requested a fresh main run'}

          def control_load_ledger(api):
              ref = api.api('/git/ref/heads/' + CONTROL_LEDGER_BRANCH, missing=True)
              if ref is None:
                  return (pe.paper_new_state(), None, True)
              doc = api.api('/contents/' + CONTROL_LEDGER_PATH + '?ref=' + CONTROL_LEDGER_BRANCH)
              if doc.get('encoding') != 'base64':
                  doc = api.api('/git/blobs/' + doc['sha'])
              if doc.get('encoding') != 'base64':
                  raise ControlError('Ledger content unavailable; no capital reset')
              state = json.loads(base64.b64decode(doc['content']), parse_constant=lambda _: (_ for _ in ()).throw(ValueError('Invalid ledger number')))
              pe.paper_validate_state(state)
              return (state, doc['sha'], False)

          def control_save_ledger(api, state, sha, new_branch):
              pe.paper_validate_state(state)
              text = json.dumps(state, ensure_ascii=False, allow_nan=False, indent=2) + '\n'
              if new_branch:
                  blob = api.api('/git/blobs', 'POST', {'content': text, 'encoding': 'utf-8'})
                  tree = api.api('/git/trees', 'POST', {'tree': [{'path': CONTROL_LEDGER_PATH, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}]})
                  commit = api.api('/git/commits', 'POST', {'message': 'Initialize virtual BR-GOLD ledger', 'tree': tree['sha'], 'parents': []})
                  ref = api.api('/git/refs', 'POST', {'ref': 'refs/heads/' + CONTROL_LEDGER_BRANCH, 'sha': commit['sha']})
                  if ref.get('object', {}).get('sha') != commit['sha']:
                      raise ControlError('Initial ledger ref unconfirmed')
                  return {'commit': commit['sha'], 'blob': blob['sha'], 'branch': CONTROL_LEDGER_BRANCH}
              body = {'message': 'chore: checkpoint virtual BR-GOLD ledger [skip ci]', 'branch': CONTROL_LEDGER_BRANCH, 'content': base64.b64encode(text.encode()).decode()}
              if sha is not None:
                  body['sha'] = sha
              result = api.api('/contents/' + CONTROL_LEDGER_PATH, 'PUT', body)
              if not result.get('commit', {}).get('sha') or not result.get('content', {}).get('sha'):
                  raise ControlError('Ledger save did not return a commit/blob receipt')
              return {'commit': result['commit']['sha'], 'blob': result['content']['sha'], 'branch': CONTROL_LEDGER_BRANCH}

          def control_read_evidence(api, run, now):
              control_verify_tree(api, run['head_sha'])
              if run['status'] != 'completed':
                  raise ControlError('Newest H1 run is not complete')
              expected = f"algopack-h1-{run['id']}-{run.get('run_attempt', 1)}"
              artifacts = api.api('/actions/runs/' + str(run['id']) + '/artifacts?per_page=100')['artifacts']
              matches = [a for a in artifacts if a['name'] == expected and (not a.get('expired'))]
              if len(matches) != 1:
                  raise ControlError('Missing/ambiguous artifact for latest run attempt')
              artifact = matches[0]
              raw = api.api('/actions/artifacts/' + str(artifact['id']) + '/zip', artifact=True)
              digest = hashlib.sha256(raw).hexdigest()
              if artifact.get('digest') and artifact['digest'] != 'sha256:' + digest:
                  raise ControlError('Artifact digest mismatch')
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  allowed = {'BR-h1.json', 'GOLD-h1.json', 'algopack-h1.json', 'summary.md'}
                  if not set(z.namelist()) <= allowed or len(z.namelist()) != len(set(z.namelist())) or sum((i.file_size for i in z.infolist())) > 5000000:
                      raise ControlError('Unexpected artifact contents')
                  report = json.loads(z.read('algopack-h1.json'))
                  if report.get('host') != 'apim.moex.com' or report.get('orders_enabled') is not False:
                      raise ControlError('Unexpected report origin/mode')
                  assets = {}
                  verification_errors = []
                  for asset in ('BR', 'GOLD'):
                      v = report.get('assets', {}).get(asset)
                      if not v:
                          verification_errors.append(asset + ': missing result')
                          continue
                      v = {'source': 'apim.moex.com', **v}
                      assets[asset] = v
                      if v.get('status') == 'DATA_ERROR':
                          continue
                      try:
                          pe.paper_validate_asset(v, now)
                          data = z.read(v['raw_h1_file'])
                          if hashlib.sha256(data).hexdigest() != v['raw_h1_sha256']:
                              raise ValueError('H1 raw hash mismatch')
                          rows = json.loads(data)
                          bars = [bg.Candle(bg.parse_iss_time(r['begin']), *[float(r[k]) for k in ('open', 'high', 'low', 'close', 'volume')]) for r in rows]
                          bg.latest_is_current(bars, now.replace(tzinfo=bg.MSK))
                          calculated = bg.indicator_snapshot(bars)
                          if any((not math.isclose(calculated[k], v['indicators'][k], rel_tol=1e-10, abs_tol=1e-08) for k in calculated if isinstance(calculated[k], float))):
                              raise ValueError('Indicator replay mismatch')
                      except (ValueError, KeyError, RuntimeError) as exc:
                          verification_errors.append(asset + ': ' + str(exc))
                          assets[asset] = {**v, 'status': 'DATA_ERROR', 'data_verified': False, 'errors': [str(exc)]}
              return (assets, {'run_id': run['id'], 'attempt': run.get('run_attempt', 1), 'head_sha': run['head_sha'], 'workflow_blob': CONTROL_EXPECTED_BLOB, 'artifact_sha256': digest, 'run_url': run['html_url']}, verification_errors)

          def control_contract(code, now):
              if not code.isalnum():
                  raise ControlError('Invalid contract code')
              payload = bg.get_json(bg.api_base() + '/' + code + '.json?iss.meta=off&iss.only=securities,marketdata')
              sec = [r for r in bg.table_rows(payload, 'securities') if r.get('SECID') == code]
              quotes = [r for r in bg.table_rows(payload, 'marketdata') if r.get('SECID') == code]
              if len(sec) != 1 or len(quotes) != 1:
                  raise ControlError('Missing/ambiguous contract metadata ' + code)
              s, q = (sec[0], quotes[0])
              c = {'asset': s['ASSETCODE'], 'expires': s['LASTTRADEDATE'], 'tick': float(s['MINSTEP']), 'point_value': float(s['STEPPRICE']) / float(s['MINSTEP']), 'margin': float(s['INITIALMARGIN']), 'exchange_fee': float(s['BUYSELLFEE']), 'bid': float(q['BID']), 'offer': float(q['OFFER']), 'quote_time': bg.parse_iss_time(q['SYSTIME']).isoformat()}
              pe.paper_validate_contract(c, now)
              return c

          def control_minutes(code, since, now):
              query = {'interval': 1, 'from': since.date().isoformat(), 'till': now.date().isoformat(), 'iss.meta': 'off'}
              result = {}
              start = 0
              for _ in range(100):
                  doc = bg.get_json(bg.api_base() + '/' + code + '/candles.json?' + urllib.parse.urlencode({**query, 'start': start}))
                  rows = bg.table_rows(doc, 'candles')
                  if not rows:
                      break
                  for r in rows:
                      t = bg.parse_iss_time(r['begin'])
                      if t.second or t.microsecond:
                          raise ControlError('Non-minute candle boundary')
                      b = {'begin': t.isoformat(), **{k: float(r[k]) for k in ('open', 'high', 'low', 'close', 'volume')}}
                      if t in result and result[t] != b:
                          raise ControlError('Conflicting M1 duplicate')
                      result[t] = b
                  start += len(rows)
              else:
                  raise ControlError('M1 pagination bound exceeded')
              return [result[t] for t in sorted(result) if t + timedelta(minutes=1) > since and t + timedelta(minutes=19) <= now]

          def control_rates(since, now):
              query = {'from': (since.date() - timedelta(days=14)).isoformat(), 'till': now.date().isoformat(), 'iss.meta': 'off'}
              result = []
              start = 0
              for _ in range(100):
                  url = 'https://apim.moex.com/iss/statistics/engines/futures/markets/indicativerates/securities/USD/RUB.json?'
                  rows = bg.table_rows(bg.get_json(url + urllib.parse.urlencode({**query, 'start': start})), 'securities')
                  if not rows:
                      break
                  for r in rows:
                      if r['secid'] == 'USD/RUB':
                          result.append({'time': r['tradedate'] + 'T' + r['tradetime'], 'rate': float(r['rate'])})
                  start += len(rows)
              else:
                  raise ControlError('FX pagination bound exceeded')
              return result

          def control_paper(api, now):
              runs = control_runs(api)
              if not runs:
                  return {'status': 'WAITING', 'reason': 'No H1 run; paper entries not evaluated'}
              run = runs[0]
              if run['status'] != 'completed':
                  return {'status': 'WAITING', 'run_id': run['id'], 'reason': 'Newest run is queued/running'}
              local = now.astimezone(bg.MSK).replace(tzinfo=None)
              assets, provenance, verification_errors = control_read_evidence(api, run, local)
              provenance['controller_commit'] = os.environ.get('GITHUB_SHA')
              state, sha, new_branch = control_load_ledger(api)
              codes = {v['contract'] for v in assets.values() if v.get('contract')}
              positions = [p for book in state['portfolios'].values() for p in book['positions'].values()]
              codes.update((p['contract'] for p in positions))
              contracts = {}
              fetch_errors = []
              for code in sorted(codes):
                  try:
                      contracts[code] = control_contract(code, local)
                  except Exception as exc:
                      fetch_errors.append(code + ': ' + control_safe_error(exc))
              minutes = {}
              rates = []
              if positions:
                  earliest = min((pe.paper_time(p['cursor']) for p in positions))
                  try:
                      rates = control_rates(earliest, local)
                      for code in sorted({p['contract'] for p in positions}):
                          since = min((pe.paper_time(p['cursor']) for p in positions if p['contract'] == code))
                          minutes[code] = control_minutes(code, since, local)
                          if not minutes[code]:
                              fetch_errors.append(code + ': no new finalized M1; session may be closed')
                  except Exception as exc:
                      fetch_errors.append('Position data: ' + control_safe_error(exc))
              entry_assets = assets if not fetch_errors else {a: {**v, 'status': 'DATA_ERROR', 'errors': fetch_errors} for a, v in assets.items()}
              observed = datetime.now(bg.MSK).replace(tzinfo=None)
              updated, details = pe.paper_apply(state, entry_assets, contracts, minutes, rates, observed, provenance)
              all_errors = verification_errors + fetch_errors + details['errors']
              if verification_errors or fetch_errors:
                  updated['errors'] = (updated['errors'] + [{'time': local.isoformat(), 'message': e} for e in verification_errors + fetch_errors])[-200:]
              receipt = control_save_ledger(api, updated, sha, new_branch)
              summary = {name: {'equity_rub': p['equity'], 'max_drawdown_pct': 100 * p['max_drawdown'], 'open_positions': len(p['positions']), 'closed_trades': p['closed_count'], 'halted': p['halted']} for name, p in updated['portfolios'].items()}
              return {'status': 'ERROR' if all_errors else 'PASSED', 'source': 'apim.moex.com', 'mode': 'VIRTUAL_ONLY', 'orders_enabled': False, 'ledger_saved': True, 'receipt': receipt, 'portfolios': summary, 'events': details['events'], 'errors': all_errors, 'provenance': provenance, 'valuation': details['valuation']}

          def control_safe_error(exc):
              message = str(exc)
              for name in ('GH_TOKEN', 'GITHUB_TOKEN', 'MOEX_ALGOPACK_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID'):
                  value = os.environ.get(name, '')
                  if value:
                      message = message.replace(value, '[REDACTED]')
              return message

          def control_main():
              directory = Path('control-evidence')
              directory.mkdir(exist_ok=True)
              now = datetime.now(timezone.utc)
              result = {'checked_at_utc': now.isoformat(), 'orders_enabled': False, 'supervisor': None, 'paper': None, 'errors': []}
              try:
                  api = ControlAPI(os.environ.get('GH_TOKEN', ''), os.environ.get('GITHUB_REPOSITORY', CONTROL_REPO))
                  if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_run':
                      try:
                          result['supervisor'] = control_supervise(api, now)
                      except Exception as exc:
                          result['errors'].append('Supervisor: ' + control_safe_error(exc))
                  if (result.get('supervisor') or {}).get('status') == 'DISPATCHED':
                      result['paper'] = {'status': 'WAITING', 'reason': 'Fresh H1 run requested; do not consume a cached older result'}
                  else:
                      try:
                          result['paper'] = control_paper(api, now)
                      except Exception as exc:
                          result['errors'].append('Paper ledger: ' + control_safe_error(exc))
              except Exception as exc:
                  result['errors'].append(control_safe_error(exc))
              if result['errors'] or (result.get('paper') or {}).get('status') == 'ERROR':
                  result['status'] = 'FAILED'
              elif (result.get('paper') or {}).get('status') == 'WAITING':
                  result['status'] = 'WAITING'
              else:
                  result['status'] = 'PASSED'
              payload = json.dumps(result, ensure_ascii=False, allow_nan=False, indent=2)
              (directory / 'cloud-control.json').write_text(payload + '\n')
              summary = '# BR/GOLD — облачный контроль\n\nТолько виртуальный учёт. Заявки и сделки не отправляются.\n\n```json\n' + payload + '\n```\n'
              (directory / 'summary.md').write_text(summary)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
                      stream.write(summary)
              compact = json.dumps(result, ensure_ascii=False, allow_nan=False, separators=(',', ':'))
              compact = compact.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(('::notice' if result['status'] == 'PASSED' else '::error') + ' title=BR-GOLD cloud control::' + compact)
              return 1 if result['status'] == 'FAILED' else 0

          sys.exit(control_main())
          PY
      - name: Retain control and error evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algopack-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: control-evidence/
          if-no-files-found: warn
          retention-days: 90
