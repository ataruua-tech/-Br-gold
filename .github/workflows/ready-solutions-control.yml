name: Ready strategies isolated native control
on:
  push:
    branches: [research/ready-solutions-20261030]
    paths:
      - '.github/workflows/ready-solutions-control.yml'
      - 'research/ready-solutions-20261030/control/*.py'
      - 'research/ready-solutions-20261030/control/protocol.json'
      - 'research/ready-solutions-20261030/control/observer-template.txt'
permissions:
  contents: read
  actions: read
concurrency:
  group: br-gold-ready-native-control
  cancel-in-progress: false
jobs:
  native-control:
    if: github.repository == 'ataruua-tech/-Br-gold'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Preserve exact source line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout only this research revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout frozen official OsEngine source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: AlexWan/OsEngine
          ref: 09b0eefc7ac6cf5a73e461cc3a81ded9c34cd54b
          path: native-source
          persist-credentials: false
          fetch-depth: 1
      - name: Prepare native SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Freeze inputs and check formula verifier
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force control-output/code | Out-Null
          Copy-Item research/ready-solutions-20261030/control/*.* control-output/code/
          dotnet --info | Out-File control-output/dotnet-info.txt
          git rev-parse HEAD | Out-File control-output/research-commit.txt
          git -C native-source rev-parse HEAD | Out-File control-output/osengine-commit.txt
          python -m unittest discover -s research/ready-solutions-20261030/control -p test_independent_indicators.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retrieve existing archives from their original Actions run
        shell: pwsh
        env:
          ARCHIVE_READ_TOKEN: ${{ github.token }}
        run: python research/ready-solutions-20261030/control/fetch_archives.py --output source-archives
      - name: Convert and independently check all source H1 rows
        shell: pwsh
        run: |
          $control = 'research/ready-solutions-20261030/control'
          python "$control/prepare_data.py" --archives source-archives --output control-output/prepared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$control/independent_indicators.py" control-output/prepared/BRX6-raw.json control-output/prepared/BRX6-expected.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$control/independent_indicators.py" control-output/prepared/GDZ6-raw.json control-output/prepared/GDZ6-expected.jsonl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:REQUIRE_ARCHIVE_CHECKS='1'
          python -m unittest discover -s research/ready-solutions-20261030/control -p test_independent_indicators.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile official native platform
        shell: pwsh
        run: |
          dotnet build native-source/project/OsEngine/OsEngine.csproj -c Debug --nologo *> control-output/native-build.log
          $buildExit = $LASTEXITCODE
          Write-Output "NATIVE_BUILD_EXIT $buildExit"
          Get-Content control-output/native-build.log -Tail 25
          if ($buildExit -ne 0) { exit $buildExit }
      - name: Prepare observation-only Custom subclasses
        shell: pwsh
        run: python research/ready-solutions-20261030/control/prepare_observers.py --source native-source --output control-output/source-audit
      - name: Four native tester runs without broker routes
        shell: pwsh
        run: |
          python research/ready-solutions-20261030/control/native_mcp_control.py --engine-dir native-source/project/OsEngine/bin/Debug --data-dir control-output/prepared/candles --output-dir control-output/runs --runtime-root isolated-runtimes --audit
      - name: Independently reconcile native event logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path control-output/runs/controller-summary.json) {
            python research/ready-solutions-20261030/control/verify_native.py --output control-output
          }
      - name: Preserve evidence and offline transport
        if: always()
        shell: pwsh
        run: python research/ready-solutions-20261030/control/package_evidence.py --output control-output
      - name: Save private research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ready-native-control-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: control-output/portable-evidence.zip
          if-no-files-found: error
          retention-days: 90

