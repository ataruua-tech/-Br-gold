# Generated by build_h1_workflow.py; readable code, standard library only.
name: AlgoPack H1 BR-GOLD

on:
  workflow_dispatch:
  schedule:
    - cron: '25 * * * *'

permissions:
  contents: read

concurrency:
  group: algopack-h1-check
  cancel-in-progress: false

jobs:
  h1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch real H1 and validate H1-H4 indicators
        env:
          MOEX_ALGOPACK_TOKEN: ${{ secrets.MOEX_ALGOPACK_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import functools
          import hashlib
          import json
          import logging
          import math
          import os
          import ssl
          import statistics
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from dataclasses import dataclass, asdict
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any


          CA_FILES = {'russian_trusted_root_ca_pem.crt': '936a43fea6e8e525bcc0f81acd9c3d21b4fc4b9b68acea7906d698005afc6504', 'russian_trusted_sub_ca_pem.crt': 'f0ae589f36774f29ef3648f7984b08d42fcce6f1ffeeb6236d773daeb2744ea6'}

          class _NoCARedirect(urllib.request.HTTPRedirectHandler):

              def redirect_request(self, *args, **kwargs):
                  return None

          @functools.lru_cache(maxsize=1)
          def moex_context():
              context = ssl.create_default_context()
              bootstrap = urllib.request.build_opener(_NoCARedirect())
              directory = Path(__file__).with_name('certs')
              for filename, expected_hash in CA_FILES.items():
                  path = directory / filename
                  if path.is_file():
                      pem = path.read_bytes()
                  else:
                      url = 'https://gu-st.ru/content/lending/' + filename
                      with bootstrap.open(url, timeout=25) as response:
                          pem = response.read(100000)
                  if hashlib.sha256(pem).hexdigest() != expected_hash:
                      raise RuntimeError('Official CA file changed: ' + filename)
                  context.load_verify_locations(cadata=pem.decode('ascii'))
              return context

          MSK = timezone(timedelta(hours=3))

          ISS = 'https://iss.moex.com/iss/engines/futures/markets/forts/boards/rfud/securities'

          ALGOPACK_ISS = 'https://apim.moex.com/iss/engines/futures/markets/forts/boards/rfud/securities'

          def api_base() -> str:
              """Never silently substitute delayed public ISS for the requested gateway."""
              if not os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip():
                  raise RuntimeError('Missing protected secret MOEX_ALGOPACK_TOKEN')
              return ALGOPACK_ISS

          LOG = logging.getLogger('br_gold_signals')

          LOOKBACK_DAYS = 85

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              """A Bearer header must never follow a redirect to a different host."""

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def safe_urlopen(request, timeout):
              handlers = [NoRedirect()]
              url = request.full_url if isinstance(request, urllib.request.Request) else request
              if urllib.parse.urlsplit(url).hostname == 'apim.moex.com':
                  handlers.append(urllib.request.HTTPSHandler(context=moex_context()))
              return urllib.request.build_opener(*handlers).open(request, timeout=timeout)

          def safe_error(exc: Exception) -> str:
              text = str(exc)
              for name in ('MOEX_ALGOPACK_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID'):
                  secret = os.environ.get(name, '')
                  if secret:
                      text = text.replace(secret, '[REDACTED]')
              return text

          @dataclass(frozen=True)
          class Candle:
              begin: datetime
              open: float
              high: float
              low: float
              close: float
              volume: float

          @dataclass(frozen=True)
          class Contract:
              secid: str
              asset: str
              expires: date
              minstep: float
              stepprice: float
              margin: float
              fee: float
              volume_today: float
              bid: float | None
              offer: float | None
              quote_time: datetime | None = None

          @dataclass(frozen=True)
          class Signal:
              contract: Contract
              side: str
              candle_time: datetime
              entry_reference: float
              stop: float
              target: float
              atr: float
              adx: float
              prior_channel: float
              ema_fast: float
              ema_slow: float
              h4_fast: float
              h4_slow: float

              @property
              def uid(self) -> str:
                  return f'{self.contract.secid}:{self.side}:{self.candle_time.isoformat()}'

          def get_json(url: str, *, timeout: int=18) -> dict[str, Any]:
              headers = {'User-Agent': 'BR-GOLD-SignalResearch/1.1', 'Accept': 'application/json', 'Cache-Control': 'no-cache'}
              token = os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip()
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != 'https' or parsed.hostname not in ('apim.moex.com', 'iss.moex.com') or parsed.username or (parsed.port not in (None, 443)):
                  raise RuntimeError('Unexpected MOEX endpoint')
              if parsed.hostname == 'apim.moex.com':
                  if not token:
                      raise RuntimeError('Missing protected secret MOEX_ALGOPACK_TOKEN')
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(url, headers=headers)
              for attempt in range(3):
                  try:
                      with safe_urlopen(request, timeout=timeout) as response:
                          if response.status != 200:
                              raise RuntimeError(f'MOEX unexpected HTTP {response.status}')
                          data = json.load(response)
                          LOG.info('MOEX HTTP %s: %s', response.status, parsed.path)
                      if not isinstance(data, dict):
                          raise RuntimeError('MOEX API returned non-object JSON')
                      return data
                  except urllib.error.HTTPError as exc:
                      if exc.code == 503:
                          detail = exc.read(4096)
                          if b'upstream connect error' in detail and b'CERTIFICATE_VERIFY_FAILED' in detail:
                              raise RuntimeError('MOEX outbound proxy TLS verification failed (CERTIFICATE_VERIFY_FAILED); check proxy trust/upstream certificate chain. Bearer authorization not verified') from None
                      if exc.code in (401, 403):
                          raise RuntimeError(f'MOEX HTTP {exc.code}: bearer token invalid/expired or subscription lacks access') from None
                      if exc.code == 429:
                          raise RuntimeError('MOEX HTTP 429: rate limit exceeded') from None
                      if attempt == 2:
                          raise RuntimeError(f'MOEX HTTP {exc.code} from official API') from None
                  except (OSError, ValueError) as exc:
                      if attempt == 2:
                          raise RuntimeError(f'MOEX API network/JSON error ({type(exc).__name__})') from None
                  time.sleep(1.5 * (attempt + 1))
              raise AssertionError('unreachable')

          def table_rows(doc: dict[str, Any], name: str) -> list[dict[str, Any]]:
              block = doc.get(name, {})
              columns = block.get('columns')
              data = block.get('data')
              if not isinstance(columns, list) or not isinstance(data, list):
                  raise RuntimeError(f'ISS response lacks {name}.columns/data')
              if len(set(columns)) != len(columns) or any((not isinstance(row, list) or len(row) != len(columns) for row in data)):
                  raise RuntimeError(f'Malformed ISS table {name}')
              return [dict(zip(columns, row)) for row in data]

          def parse_iss_time(value: str) -> datetime:
              """Convert official ISS timestamps into naive Moscow exchange time."""
              dt = datetime.fromisoformat(str(value))
              return dt.astimezone(MSK).replace(tzinfo=None) if dt.tzinfo else dt

          def select_contracts(payload: dict[str, Any], today: date, min_expiry_days: int=9) -> dict[str, Contract]:
              md = {row['SECID']: row for row in table_rows(payload, 'marketdata')}
              eligible: dict[str, list[Contract]] = {'BR': [], 'GOLD': []}
              for row in table_rows(payload, 'securities'):
                  asset = row.get('ASSETCODE')
                  if asset not in eligible or not row.get('LASTTRADEDATE'):
                      continue
                  expires = date.fromisoformat(row['LASTTRADEDATE'])
                  if (expires - today).days < min_expiry_days:
                      continue
                  secid = row['SECID']
                  quote = md.get(secid, {})
                  if any((not math.isfinite(float(row.get(k) or 0)) or float(row.get(k) or 0) <= 0 for k in ('MINSTEP', 'STEPPRICE', 'INITIALMARGIN'))):
                      continue
                  candidate = Contract(secid=secid, asset=asset, expires=expires, minstep=float(row['MINSTEP']), stepprice=float(row['STEPPRICE']), margin=float(row['INITIALMARGIN']), fee=float(row.get('BUYSELLFEE') or 0), volume_today=float(quote.get('VOLTODAY') or 0), bid=float(quote['BID']) if quote.get('BID') is not None else None, offer=float(quote['OFFER']) if quote.get('OFFER') is not None else None, quote_time=parse_iss_time(quote.get('SYSTIME')) if quote.get('SYSTIME') else None)
                  eligible[asset].append(candidate)
              result = {}
              for asset, choices in eligible.items():
                  if not choices:
                      raise RuntimeError(f'No eligible {asset} contract in ISS (expiration buffer {min_expiry_days} days)')
                  result[asset] = max(choices, key=lambda c: (c.volume_today, -c.expires.toordinal()))
              return result

          def download_contracts(now: datetime, min_expiry_days: int) -> dict[str, Contract]:
              fields = 'SECID,ASSETCODE,LASTTRADEDATE,MINSTEP,STEPPRICE,INITIALMARGIN,BUYSELLFEE'
              quotes = 'SECID,VOLTODAY,BID,OFFER,SYSTIME'
              all_sec: list[dict[str, Any]] = []
              all_md: list[dict[str, Any]] = []
              page_size = 1000
              for start in range(0, 30000, page_size):
                  query = {'iss.meta': 'off', 'iss.only': 'securities,marketdata', 'limit': page_size, 'start': start, 'securities.columns': fields, 'marketdata.columns': quotes}
                  payload = get_json(f'{api_base()}.json?{urllib.parse.urlencode(query)}')
                  sec, md = (table_rows(payload, 'securities'), table_rows(payload, 'marketdata'))
                  if not sec:
                      break
                  all_sec.extend(sec)
                  all_md.extend(md)
                  if len(sec) < page_size:
                      break
              else:
                  raise RuntimeError('Contract list exceeded 30 pages')
              if not all_sec:
                  raise RuntimeError('MOEX returned zero securities; wrong permissions or request parameters')
              consolidated = {'securities': {'columns': list(all_sec[0]), 'data': [list(x.values()) for x in all_sec]}, 'marketdata': {'columns': list(all_md[0]) if all_md else ['SECID'], 'data': [list(x.values()) for x in all_md]}}
              return select_contracts(consolidated, now.astimezone(MSK).date(), min_expiry_days)

          def download_candles(secid: str, now: datetime, days: int=LOOKBACK_DAYS) -> list[Candle]:
              local_date = now.astimezone(MSK).date()
              query = {'interval': '60', 'from': (local_date - timedelta(days=days)).isoformat(), 'till': local_date.isoformat(), 'iss.meta': 'off'}
              all_rows: dict[datetime, Candle] = {}
              start = 0
              for _ in range(60):
                  url = f"{api_base()}/{urllib.parse.quote(secid)}/candles.json?{urllib.parse.urlencode({**query, 'start': start})}"
                  rows = table_rows(get_json(url), 'candles')
                  if not rows:
                      break
                  for row in rows:
                      begin = parse_iss_time(str(row['begin']))
                      if any((row.get(k) is None for k in ('open', 'high', 'low', 'close', 'volume'))):
                          raise RuntimeError(f'Candle missing OHLCV for {secid} on {begin}')
                      candle = Candle(begin, float(row['open']), float(row['high']), float(row['low']), float(row['close']), float(row['volume']))
                      if not all((math.isfinite(v) for v in (candle.open, candle.high, candle.low, candle.close, candle.volume))):
                          raise RuntimeError(f'Non-finite OHLCV for {secid}')
                      if not 0 < candle.low <= min(candle.open, candle.close) <= max(candle.open, candle.close) <= candle.high or candle.volume < 0 or begin.minute or begin.second or begin.microsecond or (begin > now.astimezone(MSK).replace(tzinfo=None)):
                          raise RuntimeError(f'Invalid OHLCV for {secid}')
                      if begin in all_rows and all_rows[begin] != candle:
                          raise RuntimeError(f'Conflicting duplicate H1 for {secid} at {begin}')
                      all_rows[begin] = candle
                  start += len(rows)
              else:
                  raise RuntimeError(f'MOEX pagination exceeded 60 pages for {secid}')
              candles = sorted(all_rows.values(), key=lambda c: c.begin)
              if len(candles) < 220:
                  raise RuntimeError(f'Only {len(candles)} H1 candles for {secid}; at least 220 required')
              return candles

          def only_finalized(candles: list[Candle], now: datetime, buffer_minutes: int=18) -> list[Candle]:
              local_naive = now.astimezone(MSK).replace(tzinfo=None)
              return [c for c in candles if c.begin + timedelta(hours=1, minutes=buffer_minutes) <= local_naive]

          def ema(values: list[float], period: int) -> list[float | None]:
              out: list[float | None] = [None] * len(values)
              if period <= 0 or len(values) < period:
                  return out
              previous = statistics.fmean(values[:period])
              out[period - 1] = previous
              factor = 2.0 / (period + 1)
              for i in range(period, len(values)):
                  previous += factor * (values[i] - previous)
                  out[i] = previous
              return out

          def atr_adx(candles: list[Candle], period: int=14) -> tuple[list[float | None], list[float | None]]:
              n = len(candles)
              atr: list[float | None] = [None] * n
              adx: list[float | None] = [None] * n
              if period <= 0:
                  raise ValueError('period must be positive')
              if n < period + 1:
                  return (atr, adx)
              trs = [0.0] * n
              plus = [0.0] * n
              minus = [0.0] * n
              for i in range(1, n):
                  c, p = (candles[i], candles[i - 1])
                  trs[i] = max(c.high - c.low, abs(c.high - p.close), abs(c.low - p.close))
                  up, down = (c.high - p.high, p.low - c.low)
                  plus[i] = up if up > down and up > 0 else 0.0
                  minus[i] = down if down > up and down > 0 else 0.0
              trsum = sum(trs[1:period + 1])
              psum = sum(plus[1:period + 1])
              msum = sum(minus[1:period + 1])
              dx: list[float | None] = [None] * n
              for i in range(period, n):
                  if i > period:
                      trsum = trsum - trsum / period + trs[i]
                      psum = psum - psum / period + plus[i]
                      msum = msum - msum / period + minus[i]
                  atr[i] = trsum / period
                  pdi = 100.0 * psum / trsum if trsum else 0.0
                  mdi = 100.0 * msum / trsum if trsum else 0.0
                  dx[i] = 100 * abs(pdi - mdi) / (pdi + mdi) if pdi + mdi else 0.0
              if n < 2 * period:
                  return (atr, adx)
              adx[2 * period - 1] = statistics.fmean((x for x in dx[period:2 * period] if x is not None))
              for i in range(2 * period, n):
                  adx[i] = (adx[i - 1] * (period - 1) + dx[i]) / period
              return (atr, adx)

          def aggregate_h4(candles: list[Candle]) -> list[Candle]:
              buckets: dict[datetime, list[Candle]] = {}
              for c in candles:
                  bucket = c.begin.replace(hour=c.begin.hour // 4 * 4, minute=0, second=0)
                  buckets.setdefault(bucket, []).append(c)
              result = []
              for stamp in sorted(buckets):
                  bars = sorted(buckets[stamp], key=lambda x: x.begin)
                  if len(bars) != 4 or any((bars[i].begin != stamp + timedelta(hours=i) for i in range(4))):
                      continue
                  result.append(Candle(stamp, bars[0].open, max((c.high for c in bars)), min((c.low for c in bars)), bars[-1].close, sum((c.volume for c in bars))))
              return result

          def indicator_snapshot(candles: list[Candle]) -> dict[str, Any]:
              """An unready H4/indicator is a data error, never a negative trade signal."""
              if len(candles) < 220:
                  raise RuntimeError(f'Only {len(candles)} finalized H1; at least 220 required')
              if any((a.begin >= b.begin for a, b in zip(candles, candles[1:]))):
                  raise RuntimeError('H1 timestamps must be unique and increasing')
              latest = candles[-1]
              h4 = [c for c in aggregate_h4(candles) if c.begin + timedelta(hours=4) <= latest.begin + timedelta(hours=1)]
              if len(h4) < 50:
                  raise RuntimeError(f'Only {len(h4)} complete H4; at least 50 required for EMA50')
              closes = [c.close for c in candles]
              atr, adx = atr_adx(candles)
              earlier = candles[-21:-1]
              result = {'ema20': ema(closes, 20)[-1], 'ema50': ema(closes, 50)[-1], 'atr14': atr[-1], 'adx14': adx[-1], 'donchian20_high': max((c.high for c in earlier)), 'donchian20_low': min((c.low for c in earlier)), 'volume_median20': statistics.median((c.volume for c in earlier)), 'h4_ema20': ema([c.close for c in h4], 20)[-1], 'h4_ema50': ema([c.close for c in h4], 50)[-1]}
              if any((v is None or not math.isfinite(v) for v in result.values())):
                  raise RuntimeError('Indicators are not finite/ready')
              if result['atr14'] <= 0 or not 0 <= result['adx14'] <= 100.000001 or result['volume_median20'] <= 0:
                  raise RuntimeError('ATR/ADX/volume history is unusable')
              return {**result, 'h1_count': len(candles), 'h4_count': len(h4), 'h4_last_begin_msk': h4[-1].begin.isoformat(), 'volume_filter_pass': latest.volume >= 0.6 * result['volume_median20']}

          def latest_is_current(candles: list[Candle], now: datetime) -> None:
              if not candles:
                  raise RuntimeError('No finalized H1 candles')
              boundary = (now.astimezone(MSK).replace(tzinfo=None) - timedelta(minutes=18)).replace(minute=0, second=0, microsecond=0)
              expected = boundary - timedelta(hours=1)
              if candles[-1].begin != expected:
                  raise RuntimeError(f'STALE/missing H1: latest {candles[-1].begin}; expected {expected} MSK. Session may be closed')

          def tick_round(value: float, tick: float) -> float:
              decimals = max(0, len(f'{tick:.10f}'.rstrip('0').split('.')[1]))
              return round(round(value / tick) * tick, decimals)

          def compute_signals(candles: list[Candle], contract: Contract, *, adx_min: float=22.0, channel_length: int=20, atr_stop: float=1.5, reward_multiple: float=2.0) -> list[Signal]:
              if len(candles) < 220:
                  return []
              closes = [c.close for c in candles]
              fast, slow = (ema(closes, 20), ema(closes, 50))
              atrs, adxs = atr_adx(candles)
              h4 = aggregate_h4(candles)
              h4fast, h4slow = (ema([c.close for c in h4], 20), ema([c.close for c in h4], 50))
              h4_pos = 0
              signals: list[Signal] = []
              for i in range(max(100, channel_length), len(candles)):
                  c = candles[i]
                  while h4_pos < len(h4) and h4[h4_pos].begin + timedelta(hours=4) <= c.begin + timedelta(hours=1):
                      h4_pos += 1
                  j = h4_pos - 1
                  if j < 0 or any((v is None for v in (fast[i], slow[i], atrs[i], adxs[i], h4fast[j], h4slow[j]))):
                      continue
                  if adxs[i] < adx_min or atrs[i] <= 0:
                      continue
                  earlier = candles[i - channel_length:i]
                  prior_high = max((x.high for x in earlier))
                  prior_low = min((x.low for x in earlier))
                  median_volume = statistics.median((x.volume for x in earlier))
                  if median_volume <= 0 or c.volume < median_volume * 0.6:
                      continue
                  long = c.close > prior_high and fast[i] > slow[i] and (h4fast[j] > h4slow[j])
                  short = c.close < prior_low and fast[i] < slow[i] and (h4fast[j] < h4slow[j])
                  if not (long or short):
                      continue
                  side = 'BUY' if long else 'SELL'
                  direction = 1 if long else -1
                  risk_distance = float(atrs[i]) * atr_stop
                  stop = tick_round(c.close - direction * risk_distance, contract.minstep)
                  rounded_risk = direction * (c.close - stop)
                  if rounded_risk <= 0 or stop <= 0:
                      continue
                  target = tick_round(c.close + direction * rounded_risk * reward_multiple, contract.minstep)
                  if target <= 0 or direction * (target - c.close) <= 0:
                      continue
                  signals.append(Signal(contract, side, c.begin, c.close, stop, target, float(atrs[i]), float(adxs[i]), prior_high if long else prior_low, float(fast[i]), float(slow[i]), float(h4fast[j]), float(h4slow[j])))
              return signals

          def valid_spread(c: Contract, max_spread_ticks: int=5) -> bool:
              if c.bid is None or c.offer is None or (not all((math.isfinite(v) and v > 0 for v in (c.bid, c.offer)))):
                  return False
              return 0 <= c.offer - c.bid <= c.minstep * max_spread_ticks + 1e-09

          def quote_is_current(c: Contract, now: datetime, max_age_minutes: int=45) -> bool:
              """Fail closed when quote timestamp is absent or too old.

              Allow a publication delay for public ISS, but never treat Friday's quote
              as Monday's executable price. Actual broker execution must be rechecked.
              """
              if c.quote_time is None:
                  return False
              age = now.astimezone(MSK).replace(tzinfo=None) - c.quote_time
              return timedelta(minutes=-5) <= age <= timedelta(minutes=max_age_minutes)

          bg = sys.modules[__name__]

          def numerical_self_test():
              """Hand-calculated reference vectors, independent of network access."""
              if not math.isclose(bg.ema([1, 2, 4, 8, 16], 3)[-1], 127 / 12):
                  raise RuntimeError('EMA reference check failed')
              rows = [(10, 12, 9, 11), (11, 14, 10, 13), (13, 13.5, 8, 9), (9, 11, 7, 8), (8, 15, 8, 14)]
              bars = [bg.Candle(datetime(2026, 1, 1, i), *row, 100) for i, row in enumerate(rows)]
              atr, adx = bg.atr_adx(bars, 2)
              expected_atr = (4.75, 4.375, 5.6875)
              if any((not math.isclose(a, b) for a, b in zip(atr[2:], expected_atr))):
                  raise RuntimeError('Wilder ATR reference check failed')
              if not math.isclose(adx[3], 100 / 6) or not math.isclose(adx[4], (100 / 6 + 700 / 11) / 2):
                  raise RuntimeError('Wilder ADX reference check failed')
              contiguous = [bg.Candle(datetime(2026, 1, 1, i), 10, 11, 9, 10, 100) for i in range(8)]
              if len(bg.aggregate_h4(contiguous)) != 2 or len(bg.aggregate_h4(contiguous[:2] + contiguous[3:])) != 1:
                  raise RuntimeError('H4 completeness check failed')
              return {'ema_reference': True, 'atr_reference': True, 'adx_reference': True, 'h4_completeness': True}

          def check_asset(contract, now, output_dir):
              report = {'contract': contract.secid, 'asset': contract.asset, 'expires': contract.expires.isoformat(), 'status': 'DATA_ERROR', 'data_verified': False, 'errors': []}
              errors = report['errors']
              try:
                  if (contract.expires - now.astimezone(bg.MSK).date()).days < 9:
                      raise RuntimeError('Less than 9 calendar days until last trading day')
                  candles = bg.only_finalized(bg.download_candles(contract.secid, now), now)
                  if not candles:
                      raise RuntimeError('No finalized H1 candles')
                  latest = candles[-1]
                  report.update(h1_count=len(candles), last_h1_msk=latest.begin.isoformat(), close=latest.close)
                  snapshot = bg.indicator_snapshot(candles)
                  report['indicators'] = snapshot
                  bg.latest_is_current(candles, now)
                  report['data_verified'] = True
                  report['h1_trend'] = 'UP' if snapshot['ema20'] > snapshot['ema50'] else 'DOWN' if snapshot['ema20'] < snapshot['ema50'] else 'FLAT'
                  report['h4_trend'] = 'UP' if snapshot['h4_ema20'] > snapshot['h4_ema50'] else 'DOWN' if snapshot['h4_ema20'] < snapshot['h4_ema50'] else 'FLAT'
                  report['filters'] = {'adx14_at_least_22': snapshot['adx14'] >= 22, 'volume': snapshot['volume_filter_pass'], 'breakout_up': latest.close > snapshot['donchian20_high'], 'breakout_down': latest.close < snapshot['donchian20_low'], 'spread': bg.valid_spread(contract), 'quote_current': bg.quote_is_current(contract, now)}
                  report['quote'] = {'bid': contract.bid, 'offer': contract.offer, 'time_msk': contract.quote_time.isoformat() if contract.quote_time else None}
                  raw = [{**asdict(c), 'begin': c.begin.isoformat()} for c in candles]
                  payload = (json.dumps(raw, ensure_ascii=False, allow_nan=False, separators=(',', ':')) + '\n').encode()
                  output_dir.mkdir(parents=True, exist_ok=True)
                  raw_path = output_dir / (contract.asset + '-h1.json')
                  raw_path.write_bytes(payload)
                  report['raw_h1_file'] = raw_path.name
                  report['raw_h1_sha256'] = hashlib.sha256(payload).hexdigest()
                  if not report['filters']['spread']:
                      errors.append('Missing or excessive BID/OFFER spread')
                  if not report['filters']['quote_current']:
                      errors.append('Missing or stale quote timestamp')
                  signals = bg.compute_signals(candles, contract)
                  signal = signals[-1] if signals and signals[-1].candle_time == latest.begin else None
                  report['status'] = 'NO_SIGNAL'
                  if signal:
                      fill = contract.offer if signal.side == 'BUY' else contract.bid
                      report['setup'] = {'direction': 'LONG' if signal.side == 'BUY' else 'SHORT', 'entry': signal.entry_reference, 'stop': signal.stop, 'target': signal.target, 'uid': signal.uid}
                      if fill is None or not math.isfinite(fill) or abs(fill - signal.entry_reference) > signal.atr * 0.5:
                          report['status'] = 'ENTRY_CANCELLED'
                          report['entry_cancelled_reason'] = 'Current quote drift exceeds 0.5 ATR or quote is missing'
                      else:
                          report['status'] = report['setup']['direction']
                  if errors:
                      report['status'] = 'DATA_ERROR'
              except Exception as exc:
                  errors.append(bg.safe_error(exc))
                  report['status'] = 'DATA_ERROR'
              return report

          def collect_report(now, output_dir=Path('evidence')):
              report = {'checked_at_utc': now.astimezone(timezone.utc).isoformat(), 'checked_at_msk': now.astimezone(bg.MSK).isoformat(), 'host': 'apim.moex.com', 'telegram_requested': False, 'orders_enabled': False, 'assets': {}, 'errors': [], 'status': 'failed'}
              try:
                  report['numerical_self_tests'] = numerical_self_test()
                  if not os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip():
                      raise RuntimeError('Missing protected secret MOEX_ALGOPACK_TOKEN')
                  contracts = bg.download_contracts(now, 9)
                  for asset in ('BR', 'GOLD'):
                      report['assets'][asset] = check_asset(contracts[asset], now, output_dir)
                  if all((value['status'] != 'DATA_ERROR' for value in report['assets'].values())):
                      report['status'] = 'passed'
              except Exception as exc:
                  report['errors'].append(bg.safe_error(exc))
              return report

          def annotation(level, title, message):
              message = bg.safe_error(Exception(str(message)))
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{level} title={title}::{message}')

          def emit_report(report, output_dir=Path('evidence')):
              output_dir.mkdir(parents=True, exist_ok=True)
              (output_dir / 'algopack-h1.json').write_text(json.dumps(report, ensure_ascii=False, allow_nan=False, indent=2) + '\n')
              lines = ['# BR/GOLD — AlgoPack H1/H4', '', 'Проверка: ' + report['checked_at_msk'], '', 'Источник: **apim.moex.com**, Bearer из GitHub Secrets. Telegram отключён. Сделки не отправляются.', '', '| Актив | Контракт | Последняя H1, МСК | Close | H1/H4 | Результат |', '|---|---|---|---:|---|---|']
              for asset, value in report['assets'].items():
                  lines.append(f"| {asset} | {value['contract']} | {value.get('last_h1_msk', '—')} | {value.get('close', '—')} | {value.get('h1_trend', '—')}/{value.get('h4_trend', '—')} | {value['status']} |")
                  compact = {'source': 'apim.moex.com', **value}
                  annotation('error' if value['status'] == 'DATA_ERROR' else 'notice', asset + ' H1', json.dumps(compact, ensure_ascii=False, allow_nan=False, separators=(',', ':')))
                  lines += ['', '## ' + asset, '', '```json', json.dumps(value, ensure_ascii=False, allow_nan=False, indent=2), '```']
              for error in report['errors']:
                  annotation('error', 'AlgoPack H1', error)
                  lines += ['', 'Ошибка: ' + error]
              summary = '\n'.join(lines) + '\n'
              (output_dir / 'summary.md').write_text(summary)
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as stream:
                      stream.write(summary)
              annotation('notice' if report['status'] == 'passed' else 'error', 'AlgoPack H1 result', 'H1/H4 DATA CHECK ' + report['status'].upper())

          def main():
              report = collect_report(datetime.now(bg.MSK))
              emit_report(report)
              return 0 if report['status'] == 'passed' else 1

          sys.exit(main())
          PY
      - name: Save candles and calculation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algopack-h1-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
