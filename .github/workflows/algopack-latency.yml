# Read-only diagnostic. Existing H1/control workflows remain unchanged.
name: AlgoPack Latency Probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/algopack-latency.yml']
  workflow_dispatch:
    inputs:
      windows:
        description: 'Number of consecutive hourly boundaries to observe'
        type: choice
        default: '1'
        options: ['1', '2', '3']

permissions:
  contents: read

concurrency:
  group: algopack-latency-probe
  cancel-in-progress: false

jobs:
  latency:
    if: github.repository == 'ataruua-tech/-Br-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - name: Measure closed H1 availability and quote timestamps
        env:
          MOEX_ALGOPACK_TOKEN: ${{ secrets.MOEX_ALGOPACK_TOKEN }}
          PROBE_WINDOWS: ${{ inputs.windows || '1' }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import functools
          import hashlib
          import json
          import logging
          import math
          import os
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from dataclasses import dataclass, asdict
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any


          CA_FILES = {'russian_trusted_root_ca_pem.crt': '936a43fea6e8e525bcc0f81acd9c3d21b4fc4b9b68acea7906d698005afc6504', 'russian_trusted_sub_ca_pem.crt': 'f0ae589f36774f29ef3648f7984b08d42fcce6f1ffeeb6236d773daeb2744ea6'}

          class _NoCARedirect(urllib.request.HTTPRedirectHandler):

              def redirect_request(self, *args, **kwargs):
                  return None

          @functools.lru_cache(maxsize=1)
          def moex_context():
              context = ssl.create_default_context()
              bootstrap = urllib.request.build_opener(_NoCARedirect())
              directory = Path(__file__).with_name('certs')
              for filename, expected_hash in CA_FILES.items():
                  path = directory / filename
                  if path.is_file():
                      pem = path.read_bytes()
                  else:
                      url = 'https://gu-st.ru/content/lending/' + filename
                      with bootstrap.open(url, timeout=25) as response:
                          pem = response.read(100000)
                  if hashlib.sha256(pem).hexdigest() != expected_hash:
                      raise RuntimeError('Official CA file changed: ' + filename)
                  context.load_verify_locations(cadata=pem.decode('ascii'))
              return context

          MSK = timezone(timedelta(hours=3))

          ALGOPACK_ISS = 'https://apim.moex.com/iss/engines/futures/markets/forts/boards/rfud/securities'

          def api_base() -> str:
              """Never silently substitute delayed public ISS for the requested gateway."""
              if not os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip():
                  raise RuntimeError('Missing protected secret MOEX_ALGOPACK_TOKEN')
              return ALGOPACK_ISS

          LOG = logging.getLogger('br_gold_signals')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              """A Bearer header must never follow a redirect to a different host."""

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def safe_urlopen(request, timeout):
              handlers = [NoRedirect()]
              url = request.full_url if isinstance(request, urllib.request.Request) else request
              if urllib.parse.urlsplit(url).hostname == 'apim.moex.com':
                  handlers.append(urllib.request.HTTPSHandler(context=moex_context()))
              return urllib.request.build_opener(*handlers).open(request, timeout=timeout)

          def safe_error(exc: Exception) -> str:
              text = str(exc)
              for name in ('MOEX_ALGOPACK_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID'):
                  secret = os.environ.get(name, '')
                  if secret:
                      text = text.replace(secret, '[REDACTED]')
              return text

          @dataclass(frozen=True)
          class Contract:
              secid: str
              asset: str
              expires: date
              minstep: float
              stepprice: float
              margin: float
              fee: float
              volume_today: float
              bid: float | None
              offer: float | None
              quote_time: datetime | None = None

          def get_json(url: str, *, timeout: int=18) -> dict[str, Any]:
              headers = {'User-Agent': 'BR-GOLD-SignalResearch/1.1', 'Accept': 'application/json', 'Cache-Control': 'no-cache'}
              token = os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip()
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != 'https' or parsed.hostname not in ('apim.moex.com', 'iss.moex.com') or parsed.username or (parsed.port not in (None, 443)):
                  raise RuntimeError('Unexpected MOEX endpoint')
              if parsed.hostname == 'apim.moex.com':
                  if not token:
                      raise RuntimeError('Missing protected secret MOEX_ALGOPACK_TOKEN')
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(url, headers=headers)
              for attempt in range(3):
                  try:
                      with safe_urlopen(request, timeout=timeout) as response:
                          if response.status != 200:
                              raise RuntimeError(f'MOEX unexpected HTTP {response.status}')
                          data = json.load(response)
                          LOG.info('MOEX HTTP %s: %s', response.status, parsed.path)
                      if not isinstance(data, dict):
                          raise RuntimeError('MOEX API returned non-object JSON')
                      return data
                  except urllib.error.HTTPError as exc:
                      if exc.code == 503:
                          detail = exc.read(4096)
                          if b'upstream connect error' in detail and b'CERTIFICATE_VERIFY_FAILED' in detail:
                              raise RuntimeError('MOEX outbound proxy TLS verification failed (CERTIFICATE_VERIFY_FAILED); check proxy trust/upstream certificate chain. Bearer authorization not verified') from None
                      if exc.code in (401, 403):
                          raise RuntimeError(f'MOEX HTTP {exc.code}: bearer token invalid/expired or subscription lacks access') from None
                      if exc.code == 429:
                          raise RuntimeError('MOEX HTTP 429: rate limit exceeded') from None
                      if attempt == 2:
                          raise RuntimeError(f'MOEX HTTP {exc.code} from official API') from None
                  except (OSError, ValueError) as exc:
                      if attempt == 2:
                          raise RuntimeError(f'MOEX API network/JSON error ({type(exc).__name__})') from None
                  time.sleep(1.5 * (attempt + 1))
              raise AssertionError('unreachable')

          def table_rows(doc: dict[str, Any], name: str) -> list[dict[str, Any]]:
              block = doc.get(name, {})
              columns = block.get('columns')
              data = block.get('data')
              if not isinstance(columns, list) or not isinstance(data, list):
                  raise RuntimeError(f'ISS response lacks {name}.columns/data')
              if len(set(columns)) != len(columns) or any((not isinstance(row, list) or len(row) != len(columns) for row in data)):
                  raise RuntimeError(f'Malformed ISS table {name}')
              return [dict(zip(columns, row)) for row in data]

          def parse_iss_time(value: str) -> datetime:
              """Convert official ISS timestamps into naive Moscow exchange time."""
              dt = datetime.fromisoformat(str(value))
              return dt.astimezone(MSK).replace(tzinfo=None) if dt.tzinfo else dt

          def select_contracts(payload: dict[str, Any], today: date, min_expiry_days: int=9) -> dict[str, Contract]:
              md = {row['SECID']: row for row in table_rows(payload, 'marketdata')}
              eligible: dict[str, list[Contract]] = {'BR': [], 'GOLD': []}
              for row in table_rows(payload, 'securities'):
                  asset = row.get('ASSETCODE')
                  if asset not in eligible or not row.get('LASTTRADEDATE'):
                      continue
                  expires = date.fromisoformat(row['LASTTRADEDATE'])
                  if (expires - today).days < min_expiry_days:
                      continue
                  secid = row['SECID']
                  quote = md.get(secid, {})
                  if any((not math.isfinite(float(row.get(k) or 0)) or float(row.get(k) or 0) <= 0 for k in ('MINSTEP', 'STEPPRICE', 'INITIALMARGIN'))):
                      continue
                  candidate = Contract(secid=secid, asset=asset, expires=expires, minstep=float(row['MINSTEP']), stepprice=float(row['STEPPRICE']), margin=float(row['INITIALMARGIN']), fee=float(row.get('BUYSELLFEE') or 0), volume_today=float(quote.get('VOLTODAY') or 0), bid=float(quote['BID']) if quote.get('BID') is not None else None, offer=float(quote['OFFER']) if quote.get('OFFER') is not None else None, quote_time=parse_iss_time(quote.get('SYSTIME')) if quote.get('SYSTIME') else None)
                  eligible[asset].append(candidate)
              result = {}
              for asset, choices in eligible.items():
                  if not choices:
                      raise RuntimeError(f'No eligible {asset} contract in ISS (expiration buffer {min_expiry_days} days)')
                  result[asset] = max(choices, key=lambda c: (c.volume_today, -c.expires.toordinal()))
              return result

          def download_contracts(now: datetime, min_expiry_days: int) -> dict[str, Contract]:
              fields = 'SECID,ASSETCODE,LASTTRADEDATE,MINSTEP,STEPPRICE,INITIALMARGIN,BUYSELLFEE'
              quotes = 'SECID,VOLTODAY,BID,OFFER,SYSTIME'
              all_sec: list[dict[str, Any]] = []
              all_md: list[dict[str, Any]] = []
              page_size = 1000
              for start in range(0, 30000, page_size):
                  query = {'iss.meta': 'off', 'iss.only': 'securities,marketdata', 'limit': page_size, 'start': start, 'securities.columns': fields, 'marketdata.columns': quotes}
                  payload = get_json(f'{api_base()}.json?{urllib.parse.urlencode(query)}')
                  sec, md = (table_rows(payload, 'securities'), table_rows(payload, 'marketdata'))
                  if not sec:
                      break
                  all_sec.extend(sec)
                  all_md.extend(md)
                  if len(sec) < page_size:
                      break
              else:
                  raise RuntimeError('Contract list exceeded 30 pages')
              if not all_sec:
                  raise RuntimeError('MOEX returned zero securities; wrong permissions or request parameters')
              consolidated = {'securities': {'columns': list(all_sec[0]), 'data': [list(x.values()) for x in all_sec]}, 'marketdata': {'columns': list(all_md[0]) if all_md else ['SECID'], 'data': [list(x.values()) for x in all_md]}}
              return select_contracts(consolidated, now.astimezone(MSK).date(), min_expiry_days)

          bg = sys.modules[__name__]

          PROBE_POLL_SECONDS = 60

          PROBE_BEFORE_SECONDS = 120

          PROBE_AFTER_SECONDS = 1200

          PROBE_REQUEST_BUDGET = 1500

          def probe_now():
              return datetime.now(timezone.utc).astimezone(bg.MSK)

          def probe_stamp(value):
              t = datetime.fromisoformat(value)
              return t.replace(tzinfo=bg.MSK) if t.tzinfo is None else t.astimezone(bg.MSK)

          def probe_next_close(now):
              end = now.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1)
              if end - now < timedelta(seconds=PROBE_BEFORE_SECONDS):
                  end += timedelta(hours=1)
              return end

          def probe_signature(candle):
              required = ('open', 'high', 'low', 'close', 'volume')
              if not all((isinstance(candle.get(k), (float, int)) and (not isinstance(candle[k], bool)) and math.isfinite(candle[k]) for k in required)):
                  raise ValueError('Missing/non-finite OHLCV')
              if not 0 < candle['low'] <= min(candle['open'], candle['close']) <= max(candle['open'], candle['close']) <= candle['high']:
                  raise ValueError('Invalid OHLC ordering')
              if candle['volume'] < 0:
                  raise ValueError('Negative volume')
              payload = {k: float(candle[k]) for k in required}
              return hashlib.sha256(json.dumps(payload, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()).hexdigest()

          class ProbeClient:

              def __init__(self, fetch=None, clock=None, sleep=None, minimum_spacing=1.0):
                  self.fetch = fetch or bg.get_json
                  self.clock = clock or probe_now
                  self.sleep = sleep or time.sleep
                  self.minimum_spacing = minimum_spacing
                  self.previous_request = None
                  self.requests = 0

              def request(self, url, table):
                  parsed = urllib.parse.urlsplit(url)
                  if parsed.scheme != 'https' or parsed.hostname != 'apim.moex.com' or parsed.username or (parsed.port not in (None, 443)):
                      raise ValueError('Probe is restricted to the official authenticated AlgoPack gateway')
                  if self.requests >= PROBE_REQUEST_BUDGET:
                      raise ValueError('Probe request budget exceeded')
                  current = time.monotonic()
                  if self.previous_request is not None:
                      gap = self.minimum_spacing - (current - self.previous_request)
                      if gap > 0:
                          self.sleep(gap)
                  started = time.monotonic()
                  self.previous_request = started
                  self.requests += 1
                  doc = self.fetch(url)
                  received = self.clock()
                  return (bg.table_rows(doc, table), received, time.monotonic() - started)

              def candle(self, code, close):
                  if not code.isalnum():
                      raise ValueError('Invalid contract code')
                  begin = close - timedelta(hours=1)
                  query = {'interval': 60, 'from': begin.date().isoformat(), 'till': close.date().isoformat(), 'iss.meta': 'off', 'iss.only': 'candles'}
                  start = 0
                  duration = 0.0
                  received = self.clock()
                  for _ in range(20):
                      url = bg.api_base() + '/' + code + '/candles.json?' + urllib.parse.urlencode({**query, 'start': start})
                      rows, received, elapsed = self.request(url, 'candles')
                      duration += elapsed
                      if not rows:
                          return (None, received, duration)
                      matches = []
                      for row in rows:
                          stamp = bg.parse_iss_time(row['begin']).replace(tzinfo=bg.MSK)
                          if stamp != begin:
                              continue
                          c = {'begin': stamp.isoformat(), 'end_raw': row.get('end'), **{k: float(row[k]) for k in ('open', 'high', 'low', 'close', 'volume')}}
                          probe_signature(c)
                          matches.append(c)
                      if matches:
                          if any((m != matches[0] for m in matches[1:])):
                              raise ValueError('Conflicting duplicate target H1')
                          return (matches[0], received, duration)
                      start += len(rows)
                  raise ValueError('Probe H1 pagination bound exceeded')

              def quote(self, code, close):
                  query = {'iss.meta': 'off', 'iss.only': 'marketdata', 'marketdata.columns': 'SECID,BID,OFFER,SYSTIME,TIME,UPDATETIME,LAST,NUMTRADES'}
                  rows, received, elapsed = self.request(bg.api_base() + '/' + code + '.json?' + urllib.parse.urlencode(query), 'marketdata')
                  rows = [r for r in rows if r.get('SECID') == code]
                  if len(rows) != 1:
                      raise ValueError('Missing/ambiguous quote row')
                  r = rows[0]
                  bid = float(r['BID'])
                  offer = float(r['OFFER'])
                  if not math.isfinite(bid) or not math.isfinite(offer) or (not 0 < bid <= offer):
                      raise ValueError('Invalid BID/OFFER')
                  systime = probe_stamp(r['SYSTIME'])
                  age = (received - systime).total_seconds()
                  return ({'received_at_msk': received.isoformat(), 'bid': bid, 'offer': offer, 'system_time_msk': systime.isoformat(), 'system_timestamp_age_seconds': age, 'within_90_seconds': -300 <= age <= 90, 'request_seconds': elapsed, 'last_trade_time_raw': r.get('TIME'), 'update_time_raw': r.get('UPDATETIME'), 'note': 'SYSTIME freshness alone does not establish exchange-to-client feed latency'}, received)

              def sample(self, contract, close):
                  result = {'asset': contract.asset, 'contract': contract.secid, 'target_h1_begin_msk': (close - timedelta(hours=1)).isoformat(), 'target_close_msk': close.isoformat(), 'sample_started_at_msk': self.clock().isoformat(), 'candle_found': False, 'candle': None, 'quote': None, 'errors': []}
                  try:
                      candle, received, elapsed = self.candle(contract.secid, close)
                      result.update(candle=candle, candle_found=candle is not None, candle_observed_at_msk=received.isoformat(), candle_request_seconds=elapsed, seconds_from_close=(received - close).total_seconds())
                      if candle is not None:
                          result['ohlcv_sha256'] = probe_signature(candle)
                  except Exception as exc:
                      result['errors'].append(bg.safe_error(exc))
                      result['candle_observed_at_msk'] = self.clock().isoformat()
                  if any((probe_fatal_error(e) for e in result['errors'])):
                      return result
                  try:
                      result['quote'], _ = self.quote(contract.secid, close)
                  except Exception as exc:
                      result['errors'].append(bg.safe_error(exc))
                  return result

          def probe_fatal_error(message):
              return any((code in message for code in ('HTTP 401', 'HTTP 403', 'HTTP 429', 'request budget exceeded')))

          def probe_analyze(samples, close, poll_seconds=PROBE_POLL_SECONDS):
              ordered = sorted(samples, key=lambda s: probe_stamp(s['candle_observed_at_msk']))
              before = [s for s in ordered if probe_stamp(s['candle_observed_at_msk']) < close]
              post = [s for s in ordered if probe_stamp(s['candle_observed_at_msk']) >= close]
              present = [s for s in post if s.get('candle_found') and s.get('ohlcv_sha256')]
              report = {'status': 'INSUFFICIENT_OBSERVATIONS', 'has_preclose_baseline': bool(before), 'left_censored': not bool(before), 'samples_total': len(samples), 'postclose_samples': len(post), 'poll_seconds': poll_seconds, 'first_seen_after_close_seconds': None, 'earliest_observed_stable_suffix_seconds': None, 'postclose_revisions': 0, 'reference_observed_at_msk': None, 'errors': sum((len(s.get('errors', [])) for s in samples)), 'buffer_change_authorized': False, 'finality_guaranteed': False}
              quotes = [s['quote'] for s in samples if s.get('quote')]
              report['quote_observations'] = len(quotes)
              report['quotes_within_90_seconds'] = sum((q['within_90_seconds'] for q in quotes))
              report['all_observed_quote_system_timestamps_current'] = bool(quotes) and all((q['within_90_seconds'] for q in quotes))
              report['maximum_observed_quote_system_age_seconds'] = max((q['system_timestamp_age_seconds'] for q in quotes), default=None)
              times = [probe_stamp(s['candle_observed_at_msk']) for s in ordered]
              report['maximum_observation_gap_seconds'] = max(((b - a).total_seconds() for a, b in zip(times, times[1:])), default=None)
              report['cadence_complete'] = bool(times) and (report['maximum_observation_gap_seconds'] or 0) <= 2 * poll_seconds
              if not present:
                  return report
              first = present[0]
              last = present[-1]
              signature = last['ohlcv_sha256']
              report['first_seen_after_close_seconds'] = (probe_stamp(first['candle_observed_at_msk']) - close).total_seconds()
              report['reference_observed_at_msk'] = last['candle_observed_at_msk']
              report['reference_ohlcv'] = last['candle']
              report['postclose_revisions'] = sum((a['ohlcv_sha256'] != b['ohlcv_sha256'] for a, b in zip(present, present[1:])))
              suffix = []
              for sample in reversed(post):
                  if not sample.get('candle_found') or sample.get('ohlcv_sha256') != signature:
                      break
                  suffix.append(sample)
              if len(suffix) >= 2:
                  report['earliest_observed_stable_suffix_seconds'] = (probe_stamp(suffix[-1]['candle_observed_at_msk']) - close).total_seconds()
              end = close + timedelta(seconds=PROBE_AFTER_SECONDS)
              end_observed = probe_stamp(last['candle_observed_at_msk']) >= end - timedelta(seconds=2 * poll_seconds)
              enough = len(post) >= 3 and len(suffix) >= 2 and end_observed and report['cadence_complete']
              if enough and before:
                  report['status'] = 'MEASURED' if report['errors'] == 0 else 'MEASURED_WITH_ERRORS'
              elif enough:
                  report['status'] = 'LEFT_CENSORED'
              return report

          def probe_notice(kind, payload):
              message = json.dumps(payload, ensure_ascii=False, allow_nan=False, separators=(',', ':'))
              message = bg.safe_error(Exception(message)).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::' + kind + ' title=AlgoPack latency::' + message, flush=True)

          def probe_wait(target, status_path, phase):
              while probe_now() < target:
                  now = probe_now()
                  status = {'phase': phase, 'heartbeat_msk': now.isoformat(), 'wait_until_msk': target.isoformat(), 'orders_enabled': False}
                  status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2))
                  time.sleep(min(30, max(0, (target - now).total_seconds())))

          def probe_write_report(directory, report):
              directory.mkdir(exist_ok=True)
              payload = json.dumps(report, ensure_ascii=False, allow_nan=False, indent=2)
              (directory / 'latency-report.json').write_text(payload + '\n')
              lines = ['# AlgoPack — замер доступности H1', '', 'Только чтение apim.moex.com. Торговые правила и 18-минутный буфер не изменяются.', '', 'Статус: ' + report['status'], '', '| Закрытие H1, МСК | Актив | Контракт | Первое наблюдение после закрытия, с | Стабильный суффикс к позднему образцу, с | Изменений OHLCV | Статус |', '|---|---|---|---:|---:|---:|---|']
              for window in report['windows']:
                  for asset, v in window.get('analysis', {}).items():
                      lines.append('| ' + window['target_close_msk'] + ' | ' + asset + ' | ' + window['contracts'][asset]['secid'] + ' | ' + str(v['first_seen_after_close_seconds']) + ' | ' + str(v['earliest_observed_stable_suffix_seconds']) + ' | ' + str(v['postclose_revisions']) + ' | ' + v['status'] + ' |')
              lines += ['', 'Это наблюдаемые времена получения ответов с дискретностью около 60 секунд. Совпадение с последним образцом ретроспективно; оно не гарантирует окончательность свечи или такую же задержку в будущем. SYSTIME оценивает свежесть системной записи, а не доказывает задержку потока от биржи. Отсутствие свечи не является подтверждением закрытой сессии. Буфер автоматически не меняется.', '', '```json', payload, '```']
              summary = '\n'.join(lines) + '\n'
              (directory / 'summary.md').write_text(summary)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)

          def probe_main():
              directory = Path('latency-evidence')
              directory.mkdir(exist_ok=True)
              started = probe_now()
              report = {'version': 1, 'source': 'apim.moex.com', 'started_at_msk': started.isoformat(), 'status': 'RUNNING', 'poll_seconds': PROBE_POLL_SECONDS, 'observe_before_seconds': PROBE_BEFORE_SECONDS, 'observe_after_seconds': PROBE_AFTER_SECONDS, 'windows': [], 'errors': [], 'orders_enabled': False, 'signals_generated': False, 'production_buffer_changed': False, 'clock_basis': 'Runner wall clock in UTC converted to Europe/Moscow; clock offset not independently calibrated'}
              client = ProbeClient()
              try:
                  windows = int(os.environ.get('PROBE_WINDOWS', '1'))
                  if windows not in (1, 2, 3):
                      raise ValueError('PROBE_WINDOWS must be 1, 2 or 3')
                  bg.api_base()
                  bg.moex_context()
                  initial = bg.download_contracts(started, 9)
                  report['initial_contracts'] = {a: {'secid': c.secid, 'expires': c.expires.isoformat()} for a, c in initial.items()}
                  close = probe_next_close(probe_now())
                  report['planned_first_close_msk'] = close.isoformat()
                  report['planned_finish_msk'] = (close + timedelta(hours=windows - 1, seconds=PROBE_AFTER_SECONDS)).isoformat()
                  probe_write_report(directory, report)
                  probe_notice('notice', {'phase': 'PLANNED', 'first_close_msk': report['planned_first_close_msk'], 'planned_finish_msk': report['planned_finish_msk'], 'windows': windows, 'orders_enabled': False})
                  for index in range(windows):
                      target = close + timedelta(hours=index)
                      probe_wait(target - timedelta(seconds=PROBE_BEFORE_SECONDS), directory / 'probe-status.json', 'WAITING_FOR_PRECLOSE')
                      contracts = bg.download_contracts(target, 9)
                      window = {'target_close_msk': target.isoformat(), 'contracts': {a: {'secid': c.secid, 'expires': c.expires.isoformat()} for a, c in contracts.items()}, 'observations': {'BR': [], 'GOLD': []}, 'analysis': {}}
                      report['windows'].append(window)
                      for seconds in range(-PROBE_BEFORE_SECONDS, PROBE_AFTER_SECONDS + 1, PROBE_POLL_SECONDS):
                          due = target + timedelta(seconds=seconds)
                          if seconds < PROBE_AFTER_SECONDS and probe_now() > due + timedelta(seconds=PROBE_POLL_SECONDS):
                              continue
                          probe_wait(due, directory / 'probe-status.json', 'OBSERVING')
                          for asset in ('BR', 'GOLD'):
                              sample = client.sample(contracts[asset], target)
                              sample['scheduled_at_msk'] = due.isoformat()
                              window['observations'][asset].append(sample)
                              with (directory / 'observations.jsonl').open('a') as stream:
                                  stream.write(json.dumps(sample, ensure_ascii=False, allow_nan=False) + '\n')
                              if any((probe_fatal_error(e) for e in sample['errors'])):
                                  raise RuntimeError('Authorization/rate/budget failure: ' + '; '.join(sample['errors']))
                          if seconds % 300 == 0:
                              probe_notice('notice', {'phase': 'OBSERVING', 'target_close_msk': target.isoformat(), 'observed_at_msk': probe_now().isoformat(), 'candles_present': {a: window['observations'][a][-1]['candle_found'] for a in ('BR', 'GOLD')}})
                      window['analysis'] = {a: probe_analyze(window['observations'][a], target) for a in ('BR', 'GOLD')}
                      probe_write_report(directory, report)
                  analyses = [v for w in report['windows'] for v in w['analysis'].values()]
                  report['status'] = 'MEASURED' if analyses and all((v['status'] == 'MEASURED' for v in analyses)) else 'INCOMPLETE_OR_ERRORS'
              except Exception as exc:
                  report['errors'].append(bg.safe_error(exc))
                  report['status'] = 'FAILED'
              finally:
                  if report['status'] == 'RUNNING':
                      report['status'] = 'INTERRUPTED'
                  for window in report['windows']:
                      if not window['analysis']:
                          target = probe_stamp(window['target_close_msk'])
                          window['analysis'] = {a: probe_analyze(window['observations'][a], target) for a in ('BR', 'GOLD')}
                  report['finished_at_msk'] = probe_now().isoformat()
                  report['measurement_requests'] = client.requests
                  probe_write_report(directory, report)
                  (directory / 'probe-status.json').write_text(json.dumps({'phase': report['status'], 'finished_at_msk': report['finished_at_msk']}, indent=2))
                  probe_notice('notice' if report['status'] == 'MEASURED' else 'error', {'phase': 'FINISHED', 'status': report['status'], 'report': 'latency-report.json', 'errors': report['errors'], 'production_buffer_changed': False, 'orders_enabled': False})
              return 0 if report['status'] == 'MEASURED' else 1

          sys.exit(probe_main())
          PY
      - name: Retain measured observations and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algopack-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: latency-evidence/
          if-no-files-found: warn
          retention-days: 30
