# Resume only 16 incomplete records; keep 222 completed records in their verified archive.
name: AlgoPack Research Resume Sixteen
on:
  push:
    branches: [main]
    paths: ['.github/workflows/algopack-research-resume-sixteen.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: algopack-research-full-universe
  cancel-in-progress: false
jobs:
  resume:
    if: github.repository == 'ataruua-tech/-Br-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify checkpoint and resume only incomplete records
        env:
          GH_TOKEN: ${{ github.token }}
          MOEX_ALGOPACK_TOKEN: ${{ secrets.MOEX_ALGOPACK_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import functools
          import gzip
          import hashlib
          import json
          import logging
          import math
          import os
          import re
          import ssl
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any


          CA_FILES = {'russian_trusted_root_ca_pem.crt': '936a43fea6e8e525bcc0f81acd9c3d21b4fc4b9b68acea7906d698005afc6504', 'russian_trusted_sub_ca_pem.crt': 'f0ae589f36774f29ef3648f7984b08d42fcce6f1ffeeb6236d773daeb2744ea6'}

          class _NoCARedirect(urllib.request.HTTPRedirectHandler):

              def redirect_request(self, *args, **kwargs):
                  return None

          @functools.lru_cache(maxsize=1)
          def moex_context():
              context = ssl.create_default_context()
              bootstrap = urllib.request.build_opener(_NoCARedirect())
              directory = Path(__file__).with_name('certs')
              for filename, expected_hash in CA_FILES.items():
                  path = directory / filename
                  if path.is_file():
                      pem = path.read_bytes()
                  else:
                      url = 'https://gu-st.ru/content/lending/' + filename
                      with bootstrap.open(url, timeout=25) as response:
                          pem = response.read(100000)
                  if hashlib.sha256(pem).hexdigest() != expected_hash:
                      raise RuntimeError('Official CA file changed: ' + filename)
                  context.load_verify_locations(cadata=pem.decode('ascii'))
              return context

          MSK = timezone(timedelta(hours=3))

          ALGOPACK_ISS = 'https://apim.moex.com/iss/engines/futures/markets/forts/boards/rfud/securities'

          def api_base() -> str:
              """Never silently substitute delayed public ISS for the requested gateway."""
              if not os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip():
                  raise RuntimeError('Missing protected secret MOEX_ALGOPACK_TOKEN')
              return ALGOPACK_ISS

          LOG = logging.getLogger('br_gold_signals')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              """A Bearer header must never follow a redirect to a different host."""

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def safe_urlopen(request, timeout):
              handlers = [NoRedirect()]
              url = request.full_url if isinstance(request, urllib.request.Request) else request
              if urllib.parse.urlsplit(url).hostname == 'apim.moex.com':
                  handlers.append(urllib.request.HTTPSHandler(context=moex_context()))
              return urllib.request.build_opener(*handlers).open(request, timeout=timeout)

          def safe_error(exc: Exception) -> str:
              text = str(exc)
              for name in ('MOEX_ALGOPACK_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID'):
                  secret = os.environ.get(name, '')
                  if secret:
                      text = text.replace(secret, '[REDACTED]')
              return text

          def get_json(url: str, *, timeout: int=18) -> dict[str, Any]:
              headers = {'User-Agent': 'BR-GOLD-SignalResearch/1.1', 'Accept': 'application/json', 'Cache-Control': 'no-cache'}
              token = os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip()
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != 'https' or parsed.hostname not in ('apim.moex.com', 'iss.moex.com') or parsed.username or (parsed.port not in (None, 443)):
                  raise RuntimeError('Unexpected MOEX endpoint')
              if parsed.hostname == 'apim.moex.com':
                  if not token:
                      raise RuntimeError('Missing protected secret MOEX_ALGOPACK_TOKEN')
                  headers['Authorization'] = f'Bearer {token}'
              request = urllib.request.Request(url, headers=headers)
              for attempt in range(3):
                  try:
                      with safe_urlopen(request, timeout=timeout) as response:
                          if response.status != 200:
                              raise RuntimeError(f'MOEX unexpected HTTP {response.status}')
                          data = json.load(response)
                          LOG.info('MOEX HTTP %s: %s', response.status, parsed.path)
                      if not isinstance(data, dict):
                          raise RuntimeError('MOEX API returned non-object JSON')
                      return data
                  except urllib.error.HTTPError as exc:
                      if exc.code == 503:
                          detail = exc.read(4096)
                          if b'upstream connect error' in detail and b'CERTIFICATE_VERIFY_FAILED' in detail:
                              raise RuntimeError('MOEX outbound proxy TLS verification failed (CERTIFICATE_VERIFY_FAILED); check proxy trust/upstream certificate chain. Bearer authorization not verified') from None
                      if exc.code in (401, 403):
                          raise RuntimeError(f'MOEX HTTP {exc.code}: bearer token invalid/expired or subscription lacks access') from None
                      if exc.code == 429:
                          raise RuntimeError('MOEX HTTP 429: rate limit exceeded') from None
                      if attempt == 2:
                          raise RuntimeError(f'MOEX HTTP {exc.code} from official API') from None
                  except (OSError, ValueError) as exc:
                      if attempt == 2:
                          raise RuntimeError(f'MOEX API network/JSON error ({type(exc).__name__})') from None
                  time.sleep(1.5 * (attempt + 1))
              raise AssertionError('unreachable')

          def table_rows(doc: dict[str, Any], name: str) -> list[dict[str, Any]]:
              block = doc.get(name, {})
              columns = block.get('columns')
              data = block.get('data')
              if not isinstance(columns, list) or not isinstance(data, list):
                  raise RuntimeError(f'ISS response lacks {name}.columns/data')
              if len(set(columns)) != len(columns) or any((not isinstance(row, list) or len(row) != len(columns) for row in data)):
                  raise RuntimeError(f'Malformed ISS table {name}')
              return [dict(zip(columns, row)) for row in data]

          def parse_iss_time(value: str) -> datetime:
              """Convert official ISS timestamps into naive Moscow exchange time."""
              dt = datetime.fromisoformat(str(value))
              return dt.astimezone(MSK).replace(tzinfo=None) if dt.tzinfo else dt

