          def acquisition_history(client, contracts, year):
              start = date(year, 1, 1)
              end = min(date(year + 1, 1, 1), date(2026, 10, 26))
              report = []
              for c in contracts:
                  first = max(start, date.fromisoformat(c['active_start']))
                  last = min(end, date.fromisoformat(c['active_end']) + timedelta(days=7), date.fromisoformat(c['expires']) + timedelta(days=1))
                  if first >= last:
                      continue
                  try:
                      minute = client.candles(c['secid'], 1, first, last)
                      if not minute:
                          raise ValueError('No M1 rows in a nonempty frozen H1 study window')
                      warmup = max(first - timedelta(days=85), date.fromisoformat(c['first_trade'] or first.isoformat()))
                      hourly = client.candles(c['secid'], 60, warmup, last)
                      if not hourly:
                          raise ValueError('No source H1 for M1 cross-check')
                      files = [client.save(c['secid'] + '-M1.json.gz', minute), client.save(c['secid'] + '-H1.json.gz', hourly)]
                      cross = acquisition_crosscheck(minute, hourly)
                      covered = {bg.parse_iss_time(r['begin']).replace(minute=0) for r in minute}
                      missing = [r['begin'] for r in hourly if first <= bg.parse_iss_time(r['begin']).date() < last and bg.parse_iss_time(r['begin']) not in covered and (float(r['volume']) > 0)]
                      report.append({'contract': c['secid'], 'first': first.isoformat(), 'end_exclusive': last.isoformat(), 'status': 'ACQUIRED' if cross['matching_h1'] and (not cross['mismatched_h1']) and (not cross['m1_hours_missing_source_h1']) and (not missing) else 'COVERAGE_ERROR', 'files': files, 'crosscheck': cross, 'nonempty_h1_missing_all_m1': len(missing), 'missing_examples': missing[:20]})
                  except AcquisitionStop:
