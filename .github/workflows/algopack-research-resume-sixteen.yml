              path = '/iss/statistics/engines/futures/markets/indicativerates/securities/USD/RUB.json'
              rates = client.pages(path, 'securities', {'from': (start - timedelta(days=14)).isoformat(), 'till': (end - timedelta(days=1)).isoformat(), 'iss.meta': 'off'})
              if not rates:
                  raise ValueError('No historical indicative FX returned')
              client.save('USD-RUB-rates.json.gz', rates)
              return report

