name: AlgoPack connection test

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Test MOEX API with trusted CA
        env:
          MOEX_ALGOPACK_TOKEN: ${{ secrets.MOEX_ALGOPACK_TOKEN }}

        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import ssl
          import urllib.error
          import urllib.request

          token = os.environ.get('MOEX_ALGOPACK_TOKEN', '').strip()

          def fail(message):
              message = str(message)
              if token:
                  message = message.replace(token, '[REDACTED]')
              message = message.replace('%', '%25')
              message = message.replace('\r', '%0D')
              message = message.replace('\n', '%0A')
              print('::error title=AlgoPack connection::' + message)
              raise SystemExit(1)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          if not token:
              fail('Missing secret: MOEX_ALGOPACK_TOKEN')

          certificates = {
              'russian_trusted_root_ca_pem.crt':
                  '936a43fea6e8e525bcc0f81acd9c3d21b4fc4b9b68acea7906d698005afc6504',
              'russian_trusted_sub_ca_pem.crt':
                  'f0ae589f36774f29ef3648f7984b08d42fcce6f1ffeeb6236d773daeb2744ea6',
          }

          context = ssl.create_default_context()
          bootstrap = urllib.request.build_opener(NoRedirect())

          try:
              for filename, expected_hash in certificates.items():
                  url = 'https://gu-st.ru/content/lending/' + filename

                  with bootstrap.open(url, timeout=25) as response:
                      pem = response.read(100000)

                  if hashlib.sha256(pem).hexdigest() != expected_hash:
                      fail('Certificate file changed: ' + filename)

                  context.load_verify_locations(
                      cadata=pem.decode('ascii')
                  )
                  print('Trusted CA loaded:', filename)

          except Exception as error:
              fail('CA setup failed: ' + str(error))

          url = (
              'https://apim.moex.com/iss/engines/futures/'
              'markets/forts/boards/rfud/securities.json'
              '?iss.meta=off&iss.only=securities'
          )

          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/json',
              },
          )

          opener = urllib.request.build_opener(
              NoRedirect(),
              urllib.request.HTTPSHandler(context=context),
          )

          try:
              with opener.open(request, timeout=30) as response:
                  if response.status != 200:
                      fail('Unexpected HTTP status: ' + str(response.status))
                  data = json.load(response)

          except urllib.error.HTTPError as error:
              fail('MOEX HTTP ' + str(error.code))

          except urllib.error.URLError as error:
              fail('MOEX network error: ' + str(error.reason))

          except Exception as error:
              fail('MOEX request failed: ' + str(error))

          try:
              table = data['securities']
              rows = [
                  dict(zip(table['columns'], row))
                  for row in table['data']
              ]

              for asset in ('BR', 'GOLD'):
                  ids = [
                      row['SECID']
                      for row in rows
                      if row.get('ASSETCODE') == asset
                  ]

                  if not ids:
                      fail('Missing contracts: ' + asset)

                  print(
                      asset,
                      'contracts:',
                      len(ids),
                      'examples:',
                      ', '.join(ids[:3]),
                  )

          except Exception as error:
              fail('Invalid MOEX response: ' + str(error))

          print('::notice title=AlgoPack::HTTP 200. CONNECTION TEST PASSED')
          PY

              
