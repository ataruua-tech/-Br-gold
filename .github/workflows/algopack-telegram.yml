# No order APIs. Original H1/control and the 18-minute buffer stay unchanged.
name: AlgoPack Telegram BR-GOLD

on:
  push:
    branches: [main]
    paths: ['.github/workflows/algopack-telegram.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'setup obtains chat ID privately; test verifies delivery; notify checks newest H1'
        type: choice
        default: 'test'
        options: ['setup', 'test', 'notify']
  workflow_run:
    workflows: ['AlgoPack H1 BR-GOLD']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: br-gold-telegram-v1
  cancel-in-progress: false

jobs:
  telegram:
    if: github.repository == 'ataruua-tech/-Br-gold' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify receiver or deliver reviewed H1 results
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PAIR_CODE: ${{ secrets.TELEGRAM_PAIR_CODE }}
          NOTIFY_MODE: ${{ github.event_name == 'workflow_run' && 'notify' || inputs.mode || 'test' }}
          NOTIFY_EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import functools
          import hashlib
          import io
          import json
          import logging
          import math
          import os
          import re
          import ssl
          import statistics
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from dataclasses import dataclass, asdict
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any


          MSK = timezone(timedelta(hours=3))

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              """A Bearer header must never follow a redirect to a different host."""

              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def safe_error(exc: Exception) -> str:
              text = str(exc)
              for name in ('MOEX_ALGOPACK_TOKEN', 'TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID'):
                  secret = os.environ.get(name, '')
                  if secret:
                      text = text.replace(secret, '[REDACTED]')
              return text

          @dataclass(frozen=True)
          class Candle:
              begin: datetime
              open: float
              high: float
              low: float
              close: float
              volume: float

          def parse_iss_time(value: str) -> datetime:
              """Convert official ISS timestamps into naive Moscow exchange time."""
              dt = datetime.fromisoformat(str(value))
              return dt.astimezone(MSK).replace(tzinfo=None) if dt.tzinfo else dt

          def ema(values: list[float], period: int) -> list[float | None]:
              out: list[float | None] = [None] * len(values)
              if period <= 0 or len(values) < period:
                  return out
              previous = statistics.fmean(values[:period])
              out[period - 1] = previous
              factor = 2.0 / (period + 1)
              for i in range(period, len(values)):
                  previous += factor * (values[i] - previous)
                  out[i] = previous
              return out

          def atr_adx(candles: list[Candle], period: int=14) -> tuple[list[float | None], list[float | None]]:
              n = len(candles)
              atr: list[float | None] = [None] * n
              adx: list[float | None] = [None] * n
              if period <= 0:
                  raise ValueError('period must be positive')
              if n < period + 1:
                  return (atr, adx)
              trs = [0.0] * n
              plus = [0.0] * n
              minus = [0.0] * n
              for i in range(1, n):
                  c, p = (candles[i], candles[i - 1])
                  trs[i] = max(c.high - c.low, abs(c.high - p.close), abs(c.low - p.close))
                  up, down = (c.high - p.high, p.low - c.low)
                  plus[i] = up if up > down and up > 0 else 0.0
                  minus[i] = down if down > up and down > 0 else 0.0
              trsum = sum(trs[1:period + 1])
              psum = sum(plus[1:period + 1])
              msum = sum(minus[1:period + 1])
              dx: list[float | None] = [None] * n
              for i in range(period, n):
                  if i > period:
                      trsum = trsum - trsum / period + trs[i]
                      psum = psum - psum / period + plus[i]
                      msum = msum - msum / period + minus[i]
                  atr[i] = trsum / period
                  pdi = 100.0 * psum / trsum if trsum else 0.0
                  mdi = 100.0 * msum / trsum if trsum else 0.0
                  dx[i] = 100 * abs(pdi - mdi) / (pdi + mdi) if pdi + mdi else 0.0
              if n < 2 * period:
                  return (atr, adx)
              adx[2 * period - 1] = statistics.fmean((x for x in dx[period:2 * period] if x is not None))
              for i in range(2 * period, n):
                  adx[i] = (adx[i - 1] * (period - 1) + dx[i]) / period
              return (atr, adx)

          def aggregate_h4(candles: list[Candle]) -> list[Candle]:
              buckets: dict[datetime, list[Candle]] = {}
              for c in candles:
                  bucket = c.begin.replace(hour=c.begin.hour // 4 * 4, minute=0, second=0)
                  buckets.setdefault(bucket, []).append(c)
              result = []
              for stamp in sorted(buckets):
                  bars = sorted(buckets[stamp], key=lambda x: x.begin)
                  if len(bars) != 4 or any((bars[i].begin != stamp + timedelta(hours=i) for i in range(4))):
                      continue
                  result.append(Candle(stamp, bars[0].open, max((c.high for c in bars)), min((c.low for c in bars)), bars[-1].close, sum((c.volume for c in bars))))
              return result

          def indicator_snapshot(candles: list[Candle]) -> dict[str, Any]:
              """An unready H4/indicator is a data error, never a negative trade signal."""
              if len(candles) < 220:
                  raise RuntimeError(f'Only {len(candles)} finalized H1; at least 220 required')
              if any((a.begin >= b.begin for a, b in zip(candles, candles[1:]))):
                  raise RuntimeError('H1 timestamps must be unique and increasing')
              latest = candles[-1]
              h4 = [c for c in aggregate_h4(candles) if c.begin + timedelta(hours=4) <= latest.begin + timedelta(hours=1)]
              if len(h4) < 50:
                  raise RuntimeError(f'Only {len(h4)} complete H4; at least 50 required for EMA50')
              closes = [c.close for c in candles]
              atr, adx = atr_adx(candles)
              earlier = candles[-21:-1]
              result = {'ema20': ema(closes, 20)[-1], 'ema50': ema(closes, 50)[-1], 'atr14': atr[-1], 'adx14': adx[-1], 'donchian20_high': max((c.high for c in earlier)), 'donchian20_low': min((c.low for c in earlier)), 'volume_median20': statistics.median((c.volume for c in earlier)), 'h4_ema20': ema([c.close for c in h4], 20)[-1], 'h4_ema50': ema([c.close for c in h4], 50)[-1]}
              if any((v is None or not math.isfinite(v) for v in result.values())):
                  raise RuntimeError('Indicators are not finite/ready')
              if result['atr14'] <= 0 or not 0 <= result['adx14'] <= 100.000001 or result['volume_median20'] <= 0:
                  raise RuntimeError('ATR/ADX/volume history is unusable')
              return {**result, 'h1_count': len(candles), 'h4_count': len(h4), 'h4_last_begin_msk': h4[-1].begin.isoformat(), 'volume_filter_pass': latest.volume >= 0.6 * result['volume_median20']}

          def latest_is_current(candles: list[Candle], now: datetime) -> None:
              if not candles:
                  raise RuntimeError('No finalized H1 candles')
              boundary = (now.astimezone(MSK).replace(tzinfo=None) - timedelta(minutes=18)).replace(minute=0, second=0, microsecond=0)
              expected = boundary - timedelta(hours=1)
              if candles[-1].begin != expected:
                  raise RuntimeError(f'STALE/missing H1: latest {candles[-1].begin}; expected {expected} MSK. Session may be closed')

          bg = sys.modules[__name__]

          PAPER_MSK = timezone(timedelta(hours=3))

          def paper_time(value):
              t = datetime.fromisoformat(value)
              if t.tzinfo is not None:
                  t = t.astimezone(PAPER_MSK).replace(tzinfo=None)
              return t

          def paper_expected_h1(now):
              return (now - timedelta(minutes=18)).replace(minute=0, second=0, microsecond=0) - timedelta(hours=1)

          def paper_validate_asset(v, now):
              if v.get('source') != 'apim.moex.com' or v.get('data_verified') is not True or v.get('errors'):
                  raise ValueError('Unverified AlgoPack asset')
              if v.get('asset') not in ('BR', 'GOLD') or not isinstance(v.get('contract'), str):
                  raise ValueError('Invalid contract identity')
              if paper_time(v['last_h1_msk']) != paper_expected_h1(now):
                  raise ValueError('Stale H1')
              if (datetime.fromisoformat(v['expires']).date() - now.date()).days < 9:
                  raise ValueError('Contract expiry buffer violated')
              q, f, i = (v['quote'], v['filters'], v['indicators'])
              qt = paper_time(q['time_msk'])
              if not now - timedelta(minutes=45) <= qt <= now + timedelta(minutes=5):
                  raise ValueError('Stale quote in source report')
              if not all((math.isfinite(q[k]) and q[k] > 0 for k in ('bid', 'offer'))) or q['bid'] > q['offer']:
                  raise ValueError('Invalid source bid/offer')
              if f.get('spread') is not True or f.get('quote_current') is not True:
                  raise ValueError('Spread/quote filter failed')
              for key in ('ema20', 'ema50', 'h4_ema20', 'h4_ema50', 'atr14', 'adx14', 'donchian20_high', 'donchian20_low', 'volume_median20'):
                  if not math.isfinite(i[key]):
                      raise ValueError('Non-finite indicator')
              if i['atr14'] <= 0 or not 0 <= i['adx14'] <= 100.000001 or i['volume_median20'] <= 0:
                  raise ValueError('Invalid ATR/ADX/volume')
              status = v.get('status')
              if status not in ('NO_SIGNAL', 'LONG', 'SHORT', 'ENTRY_CANCELLED'):
                  raise ValueError('Data-error/unknown status')
              if status in ('LONG', 'SHORT'):
                  direction = 1 if status == 'LONG' else -1
                  setup = v['setup']
                  if not all((math.isfinite(setup[k]) and setup[k] > 0 for k in ('entry', 'stop', 'target'))):
                      raise ValueError('Invalid setup levels')
                  if direction * (setup['entry'] - setup['stop']) <= 0 or direction * (setup['target'] - setup['entry']) <= 0:
                      raise ValueError('Invalid setup ordering')
                  if not (direction * (i['ema20'] - i['ema50']) > 0 and direction * (i['h4_ema20'] - i['h4_ema50']) > 0 and (i['adx14'] >= 22) and (f.get('volume') is True) and (f.get('breakout_up' if direction == 1 else 'breakout_down') is True)):
                      raise ValueError('Signal fails frozen Donchian rules')
                  if not isinstance(setup.get('uid'), str) or not setup['uid']:
                      raise ValueError('Missing setup UID')

          pe = sys.modules[__name__]

          CONTROL_REPO = 'ataruua-tech/-Br-gold'

          CONTROL_WORKFLOW = 'algopack-h1.yml'

          CONTROL_PATH = '.github/workflows/algopack-h1.yml'

          CONTROL_EXPECTED_BLOB = '38e147112ad48c3959b4dff6838fbec88d66f576'

          class ControlError(RuntimeError):
              pass

          def control_utc(value):
              return datetime.fromisoformat(value.replace('Z', '+00:00')).astimezone(timezone.utc)

          def control_runs(api):
              payload = api.api('/actions/workflows/' + CONTROL_WORKFLOW + '/runs?branch=main&per_page=30')
              return sorted([r for r in payload['workflow_runs'] if r['head_branch'] == 'main' and r['path'] == CONTROL_PATH], key=lambda r: (r['created_at'], r['id']), reverse=True)

          def control_verify_tree(api, sha):
              tree = api.api('/git/trees/' + sha + '?recursive=1')
              if tree.get('truncated'):
                  raise ControlError('Incomplete or unexpected source tree')
              matches = [x for x in tree['tree'] if x['path'] == CONTROL_PATH and x['type'] == 'blob']
              if len(matches) != 1 or matches[0]['sha'] != CONTROL_EXPECTED_BLOB:
                  raise ControlError('Reviewed H1 workflow blob changed; dispatch/entries blocked')

          def control_read_evidence(api, run, now):
              control_verify_tree(api, run['head_sha'])
              if run['status'] != 'completed':
                  raise ControlError('Newest H1 run is not complete')
              expected = f"algopack-h1-{run['id']}-{run.get('run_attempt', 1)}"
              artifacts = api.api('/actions/runs/' + str(run['id']) + '/artifacts?per_page=100')['artifacts']
              matches = [a for a in artifacts if a['name'] == expected and (not a.get('expired'))]
              if len(matches) != 1:
                  raise ControlError('Missing/ambiguous artifact for latest run attempt')
              artifact = matches[0]
              raw = api.api('/actions/artifacts/' + str(artifact['id']) + '/zip', artifact=True)
              digest = hashlib.sha256(raw).hexdigest()
              if artifact.get('digest') and artifact['digest'] != 'sha256:' + digest:
                  raise ControlError('Artifact digest mismatch')
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  allowed = {'BR-h1.json', 'GOLD-h1.json', 'algopack-h1.json', 'summary.md'}
                  if not set(z.namelist()) <= allowed or len(z.namelist()) != len(set(z.namelist())) or sum((i.file_size for i in z.infolist())) > 5000000:
                      raise ControlError('Unexpected artifact contents')
                  report = json.loads(z.read('algopack-h1.json'))
                  if report.get('host') != 'apim.moex.com' or report.get('orders_enabled') is not False:
                      raise ControlError('Unexpected report origin/mode')
                  assets = {}
                  verification_errors = []
                  for asset in ('BR', 'GOLD'):
                      v = report.get('assets', {}).get(asset)
                      if not v:
                          verification_errors.append(asset + ': missing result')
                          continue
                      v = {'source': 'apim.moex.com', **v}
                      assets[asset] = v
                      if v.get('status') == 'DATA_ERROR':
                          continue
                      try:
                          pe.paper_validate_asset(v, now)
                          data = z.read(v['raw_h1_file'])
                          if hashlib.sha256(data).hexdigest() != v['raw_h1_sha256']:
                              raise ValueError('H1 raw hash mismatch')
                          rows = json.loads(data)
                          bars = [bg.Candle(bg.parse_iss_time(r['begin']), *[float(r[k]) for k in ('open', 'high', 'low', 'close', 'volume')]) for r in rows]
                          bg.latest_is_current(bars, now.replace(tzinfo=bg.MSK))
                          calculated = bg.indicator_snapshot(bars)
                          if any((not math.isclose(calculated[k], v['indicators'][k], rel_tol=1e-10, abs_tol=1e-08) for k in calculated if isinstance(calculated[k], float))):
                              raise ValueError('Indicator replay mismatch')
                      except (ValueError, KeyError, RuntimeError) as exc:
                          verification_errors.append(asset + ': ' + str(exc))
                          assets[asset] = {**v, 'status': 'DATA_ERROR', 'data_verified': False, 'errors': [str(exc)]}
              return (assets, {'run_id': run['id'], 'attempt': run.get('run_attempt', 1), 'head_sha': run['head_sha'], 'workflow_blob': CONTROL_EXPECTED_BLOB, 'artifact_sha256': digest, 'run_url': run['html_url']}, verification_errors)

          cc = sys.modules[__name__]

          NOTIFY_REPO = 'ataruua-tech/-Br-gold'

          NOTIFY_BRANCH = 'telegram-ledger'

          NOTIFY_PATH = 'telegram-state.json'

          NOTIFY_LEDGER_LIMIT = 10000

          class NotifyError(RuntimeError):
              pass

          def notify_safe_error(exc):
              value = bg.safe_error(exc)
              for key in ('GH_TOKEN', 'GITHUB_TOKEN', 'TELEGRAM_PAIR_CODE'):
                  secret = os.environ.get(key, '')
                  if secret:
                      value = value.replace(secret, '[REDACTED]')
              return value

          def notify_json(raw):
              return json.loads(raw, parse_constant=lambda _: (_ for _ in ()).throw(NotifyError('Non-finite JSON')))

          class NotifyAPI:
              """GitHub permissions narrowed to one isolated notification-ledger branch."""

              def __init__(self, token):
                  if not token:
                      raise NotifyError('Missing short-lived GitHub Actions token')
                  self.token = token

              def api(self, suffix, method='GET', body=None, missing=False, artifact=False):
                  if not suffix.startswith('/') or '..' in suffix or method not in ('GET', 'POST', 'PUT'):
                      raise NotifyError('Unexpected GitHub operation')
                  if method == 'PUT' and (suffix != '/contents/' + NOTIFY_PATH or (body or {}).get('branch') != NOTIFY_BRANCH):
                      raise NotifyError('Only the Telegram ledger may be updated')
                  if method == 'POST':
                      if suffix not in ('/git/refs', '/git/blobs', '/git/trees', '/git/commits'):
                          raise NotifyError('Notification workflow cannot dispatch jobs or orders')
                      if suffix == '/git/refs' and (body or {}).get('ref') != 'refs/heads/' + NOTIFY_BRANCH:
                          raise NotifyError('Only the Telegram ledger branch may be created')
                      if suffix == '/git/trees' and ('base_tree' in (body or {}) or [x.get('path') for x in (body or {}).get('tree', [])] != [NOTIFY_PATH]):
                          raise NotifyError('Initial tree must contain only the Telegram ledger')
                      if suffix == '/git/commits' and (body or {}).get('parents') != []:
                          raise NotifyError('Initial ledger commit must be isolated')
                  headers = {'Authorization': 'Bearer ' + self.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'BR-GOLD-Telegram/1'}
                  data = None if body is None else json.dumps(body, allow_nan=False).encode()
                  if data is not None:
                      headers['Content-Type'] = 'application/json'
                  request = urllib.request.Request('https://api.github.com/repos/' + NOTIFY_REPO + suffix, data=data, headers=headers, method=method)
                  opener = urllib.request.build_opener(bg.NoRedirect())
                  try:
                      with opener.open(request, timeout=30) as response:
                          raw = response.read(5000001)
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404 and missing:
                          return None
                      if exc.code in (301, 302, 303, 307, 308) and artifact:
                          target = exc.headers.get('Location', '')
                          parsed = urllib.parse.urlsplit(target)
                          allowed = parsed.hostname and any((parsed.hostname.endswith(s) for s in ('.blob.core.windows.net', '.actions.githubusercontent.com', '.githubusercontent.com')))
                          if parsed.scheme != 'https' or not allowed or parsed.username or (parsed.port not in (None, 443)):
                              raise NotifyError('Unexpected artifact-storage redirect') from None
                          with opener.open(target, timeout=30) as response:
                              raw = response.read(5000001)
                      else:
                          raise NotifyError('GitHub HTTP ' + str(exc.code) + ' during ' + method + ' ' + suffix.split('?')[0]) from None
                  if len(raw) > 5000000:
                      raise NotifyError('GitHub response exceeds bounded size')
                  if artifact:
                      return raw
                  return notify_json(raw) if raw else {}

          def notify_new_state():
              return {'schema': 1, 'deliveries': {}, 'acceptance': {}}

          def notify_validate_state(state):
              if state.get('schema') != 1 or not isinstance(state.get('deliveries'), dict) or (not isinstance(state.get('acceptance'), dict)):
                  raise NotifyError('Invalid Telegram ledger; refusing to reset notification history')
              if len(state['deliveries']) > NOTIFY_LEDGER_LIMIT:
                  raise NotifyError('Telegram ledger limit reached; manual archival is required')
              for key, value in state['deliveries'].items():
                  if not isinstance(key, str) or not isinstance(value, dict) or value.get('status') not in ('INTENT', 'SENT', 'UNCERTAIN'):
                      raise NotifyError('Corrupt Telegram delivery record')

          class NotifyLedger:

              def __init__(self, api):
                  self.api = api
                  ref = api.api('/git/ref/heads/' + NOTIFY_BRANCH, missing=True)
                  self.new = ref is None
                  self.sha = None
                  self.state = notify_new_state()
                  if not self.new:
                      doc = api.api('/contents/' + NOTIFY_PATH + '?ref=' + NOTIFY_BRANCH)
                      if doc.get('encoding') != 'base64':
                          doc = api.api('/git/blobs/' + doc['sha'])
                      if doc.get('encoding') != 'base64':
                          raise NotifyError('Telegram ledger contents unavailable')
                      self.state = notify_json(base64.b64decode(doc['content']))
                      self.sha = doc['sha']
                  notify_validate_state(self.state)

              def save(self):
                  notify_validate_state(self.state)
                  raw = (json.dumps(self.state, ensure_ascii=False, allow_nan=False, indent=2) + '\n').encode()
                  if len(raw) > 4000000:
                      raise NotifyError('Telegram ledger size limit reached')
                  if self.new:
                      blob = self.api.api('/git/blobs', 'POST', {'content': raw.decode(), 'encoding': 'utf-8'})
                      tree = self.api.api('/git/trees', 'POST', {'tree': [{'path': NOTIFY_PATH, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}]})
                      commit = self.api.api('/git/commits', 'POST', {'message': 'Initialize Telegram delivery ledger', 'tree': tree['sha'], 'parents': []})
                      ref = self.api.api('/git/refs', 'POST', {'ref': 'refs/heads/' + NOTIFY_BRANCH, 'sha': commit['sha']})
                      if ref.get('object', {}).get('sha') != commit['sha']:
                          raise NotifyError('Initial Telegram ledger checkpoint not confirmed')
                      self.new = False
                      self.sha = blob['sha']
                  else:
                      result = self.api.api('/contents/' + NOTIFY_PATH, 'PUT', {'message': 'Checkpoint Telegram delivery intent [skip ci]', 'branch': NOTIFY_BRANCH, 'sha': self.sha, 'content': base64.b64encode(raw).decode()})
                      if not result.get('commit', {}).get('sha') or not result.get('content', {}).get('sha'):
                          raise NotifyError('Telegram ledger checkpoint not confirmed')
                      self.sha = result['content']['sha']

          def notify_code_digest():
              if NOTIFY_CODE_SHA256:
                  return NOTIFY_CODE_SHA256
              root = Path(__file__).parent
              return hashlib.sha256(b''.join(((root / name).read_bytes() for name in ('telegram_notify.py', 'br_gold_signals.py', 'moex_tls.py', 'cloud_control.py', 'paper_engine.py')))).hexdigest()

          def notify_configuration():
              token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
              chat = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
              if not token or not chat:
                  raise NotifyError('Add protected GitHub Secrets TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID; never paste them in chat or code')
              if not re.fullmatch('[1-9][0-9]*:[A-Za-z0-9_-]+', token) or not re.fullmatch('-?[1-9][0-9]*', chat):
                  raise NotifyError('Invalid Telegram secret format; TELEGRAM_CHAT_ID must be a numeric chat ID')
              digest = hashlib.sha256(json.dumps([notify_code_digest(), token, chat], separators=(',', ':')).encode()).hexdigest()
              return (token, chat, digest)

          def notify_telegram_api(method, payload, token):
              if method not in ('sendMessage', 'getUpdates'):
                  raise NotifyError('Unexpected Telegram method')
              body = json.dumps(payload, ensure_ascii=False).encode()
              request = urllib.request.Request('https://api.telegram.org/bot' + token + '/' + method, data=body, headers={'Content-Type': 'application/json'}, method='POST')
              try:
                  with urllib.request.build_opener(bg.NoRedirect()).open(request, timeout=20) as response:
                      raw = response.read(1000001)
                      if len(raw) > 1000000:
                          raise NotifyError('Telegram response exceeds bounded size')
                      result = notify_json(raw)
              except urllib.error.HTTPError as exc:
                  raise NotifyError('Telegram HTTP ' + str(exc.code) + '; delivery not confirmed') from None
              except Exception:
                  raise NotifyError('Telegram response unavailable; delivery not confirmed') from None
              if not isinstance(result, dict) or result.get('ok') is not True:
                  raise NotifyError('Telegram API refused the request')
              return result.get('result')

          def notify_telegram(message, token, chat):
              if not isinstance(message, str) or not 0 < len(message) <= 4096:
                  raise NotifyError('Invalid Telegram message size')
              value = notify_telegram_api('sendMessage', {'chat_id': chat, 'text': message, 'disable_web_page_preview': True}, token)
              if not isinstance(value, dict) or not isinstance(value.get('message_id'), int) or isinstance(value.get('message_id'), bool) or (value['message_id'] <= 0) or (value.get('chat', {}).get('id') != int(chat)):
                  raise NotifyError('Telegram receipt/destination not confirmed')
              return {'message_id': value['message_id'], 'telegram_date': value.get('date')}

          def notify_setup(ledger, now, sender=None, reader=None):
              token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
              code = os.environ.get('TELEGRAM_PAIR_CODE', '').strip()
              if not re.fullmatch('[1-9][0-9]*:[A-Za-z0-9_-]+', token):
                  raise NotifyError('Add protected GitHub Secret TELEGRAM_BOT_TOKEN')
              if not re.fullmatch('[A-Za-z0-9_-]{12,64}', code):
                  raise NotifyError('Add protected Secret TELEGRAM_PAIR_CODE (12-64 random letters/digits), then send /start followed by that code to your own bot')
              updates = (reader or notify_telegram_api)('getUpdates', {'timeout': 0, 'limit': 100, 'allowed_updates': ['message']}, token)
              if not isinstance(updates, list):
                  raise NotifyError('Invalid Telegram pairing response')
              matches = set()
              for update in updates:
                  message = update.get('message', {})
                  chat, owner = (message.get('chat', {}), message.get('from', {}))
                  stamp = message.get('date')
                  if chat.get('type') == 'private' and owner.get('is_bot') is False and (owner.get('id') == chat.get('id')) and isinstance(chat.get('id'), int) and (not isinstance(chat['id'], bool)) and (chat['id'] > 0) and isinstance(stamp, int) and (now.timestamp() - 1800 <= stamp <= now.timestamp() + 300) and (message.get('text') == '/start ' + code):
                      matches.add(str(chat['id']))
              if len(matches) != 1:
                  raise NotifyError('Send /start followed by TELEGRAM_PAIR_CODE to the bot in a private chat, then rerun setup; no unique recent match found')
              chat = matches.pop()
              key = 'setup:' + hashlib.sha256(json.dumps([notify_code_digest(), token, code, chat]).encode()).hexdigest()
              return notify_deliver(ledger, key, '✅ BR/GOLD — личный чат подтверждён.\n\nТвой TELEGRAM_CHAT_ID: ' + chat + '\n\nДобавь его в GitHub Secrets с именем TELEGRAM_CHAT_ID. Затем запусти AlgoPack Telegram BR-GOLD в режиме test.\nЭто настройка канала. Торговые сигналы ещё не включены.', token, chat, now, {'kind': 'SETUP'}, sender)

          def notify_deliver(ledger, key, message, token, chat, now, metadata=None, sender=None):
              existing = ledger.state['deliveries'].get(key)
              if existing:
                  if existing['status'] != 'SENT':
                      raise NotifyError('Previous delivery is uncertain; automatic repeat blocked: ' + key)
                  return {'status': 'ALREADY_SENT', 'key': key}
              ledger.state['deliveries'][key] = {'status': 'INTENT', 'created_at_msk': now.isoformat(), **(metadata or {})}
              ledger.save()
              try:
                  receipt = (sender or notify_telegram)(message, token, chat)
              except Exception as exc:
                  ledger.state['deliveries'][key].update(status='UNCERTAIN', error=notify_safe_error(exc))
                  ledger.save()
                  raise NotifyError('Telegram delivery uncertain; automatic repeat blocked') from None
              ledger.state['deliveries'][key].update(status='SENT', confirmed_at_msk=now.isoformat(), **receipt)
              ledger.save()
              return {'status': 'SENT', 'key': key, **receipt}

          def notify_require_acceptance(ledger, fingerprint):
              entry = ledger.state['acceptance'].get(fingerprint)
              test = ledger.state['deliveries'].get('test:' + fingerprint, {})
              if not entry or test.get('status') != 'SENT' or entry.get('message_id') != test.get('message_id'):
                  raise NotifyError('Telegram is not verified for this code and destination: run workflow mode=test first')

          def notify_test(ledger, token, chat, fingerprint, now, sender=None):
              result = notify_deliver(ledger, 'test:' + fingerprint, '✅ BR/GOLD — тест доставки Telegram.\nКанал подключён. Это технический тест, а не торговый сигнал.\nРыночные сигналы отправляются только после проверки AlgoPack H1/H4. Сделки не исполняются.', token, chat, now, {'kind': 'TEST'}, sender)
              record = ledger.state['deliveries']['test:' + fingerprint]
              if fingerprint not in ledger.state['acceptance']:
                  ledger.state['acceptance'][fingerprint] = {'message_id': record['message_id'], 'verified_at_msk': now.isoformat(), 'code_sha256': notify_code_digest()}
                  ledger.save()
              return result

          def notify_select_run(api, event_run_id=None):
              runs = cc.control_runs(api)
              if not runs:
                  raise NotifyError('No H1 workflow runs on main')
              run = runs[0]
              if event_run_id is not None and run['id'] != event_run_id:
                  return None
              if run.get('head_repository', {}).get('full_name', NOTIFY_REPO) != NOTIFY_REPO:
                  raise NotifyError('Unexpected source repository')
              cc.control_verify_tree(api, run['head_sha'])
              if run['status'] != 'completed':
                  raise NotifyError('Newest H1 run is still queued/running')
              if run.get('conclusion') != 'success':
                  raise NotifyError('Newest H1 run failed; an older success cannot replace it')
              return run

          def notify_validate_signal(value, now):
              local = now.astimezone(bg.MSK).replace(tzinfo=None)
              cc.pe.paper_validate_asset(value, local)
              code = value['contract']
              if not re.fullmatch('[A-Za-z0-9]{3,20}', code):
                  raise NotifyError('Invalid real contract code')
              if value['status'] not in ('LONG', 'SHORT', 'ENTRY_CANCELLED'):
                  return
              setup = value['setup']
              direction = setup.get('direction') if value['status'] == 'ENTRY_CANCELLED' else value['status']
              if direction not in ('LONG', 'SHORT'):
                  raise NotifyError('Invalid cancelled setup direction')
              side = 'BUY' if direction == 'LONG' else 'SELL'
              expected = code + ':' + side + ':' + bg.parse_iss_time(value['last_h1_msk']).isoformat()
              if setup['uid'] != expected or setup.get('direction') != direction:
                  raise NotifyError('Setup UID/direction does not match this contract and H1')
              if not math.isclose(setup['entry'], value['close'], rel_tol=0, abs_tol=1e-09):
                  raise NotifyError('Setup entry is not the reported H1 close')
              if value['status'] == 'ENTRY_CANCELLED':
                  return
              quote = value['quote']['offer' if side == 'BUY' else 'bid']
              if abs(quote - setup['entry']) > 0.5 * value['indicators']['atr14']:
                  raise NotifyError('Source quote drift exceeds 0.5 ATR')

          def notify_render_signal(value, provenance):
              start = bg.parse_iss_time(value['last_h1_msk'])
              end = start + timedelta(hours=1)
              setup = value['setup']
              quote = bg.parse_iss_time(value['quote']['time_msk'])
              channel = 'максимума' if value['status'] == 'LONG' else 'минимума'
              return ('🟢 ' if value['status'] == 'LONG' else '🔴 ') + value['status'] + ' · ' + value['asset'] + ' · ' + value['contract'] + f"\nH1: {start:%d.%m.%Y %H:%M}–{end:%H:%M} МСК\nВход по закрытию H1: {setup['entry']:g}\nСтоп: {setup['stop']:g} · Цель: {setup['target']:g}\nПробой Donchian20 {channel}, EMA20/50 H1+H4, ADX14={value['indicators']['adx14']:.1f}, объём подтверждён.\nКотировка из расчёта: {quote:%d.%m.%Y %H:%M:%S} МСК.\nВход — расчётный уровень, текущая цена исполнения может отличаться.\nЭкспериментальная стратегия. Автоматического исполнения нет.\n" + provenance['run_url']

          def notify_publish(api, ledger, token, chat, fingerprint, now, event_run_id=None, sender=None):
              notify_require_acceptance(ledger, fingerprint)
              try:
                  run = notify_select_run(api, event_run_id)
                  if run is None:
                      return {'status': 'SUPERSEDED', 'deliveries': []}
                  local = now.astimezone(bg.MSK).replace(tzinfo=None)
                  assets, provenance, replay_errors = cc.control_read_evidence(api, run, local)
              except Exception as exc:
                  key = 'error:' + now.astimezone(bg.MSK).strftime('%Y-%m-%dT%H') + ':SYSTEM'
                  error = notify_safe_error(exc)
                  receipt = notify_deliver(ledger, key, '⚠️ ПРОВЕРКА НЕ УДАЛАСЬ\n' + error + '\nhttps://github.com/' + NOTIFY_REPO + '/actions/workflows/algopack-h1.yml', token, chat, now, {'kind': 'ERROR'}, sender)
                  return {'status': 'DATA_ERRORS', 'errors': [error], 'deliveries': [receipt]}
              result = {'status': 'CHECKED', 'source': provenance, 'deliveries': [], 'assets': {}, 'replay_errors': replay_errors}
              for asset in ('BR', 'GOLD'):
                  value = assets.get(asset)
                  try:
                      if not value or value.get('asset') != asset:
                          raise NotifyError('Missing/incorrect asset result')
                      notify_validate_signal(value, now)
                      status = value['status']
                  except Exception as exc:
                      error = notify_safe_error(exc)
                      result['assets'][asset] = {'status': 'DATA_ERROR', 'errors': [error]}
                      key = 'error:' + now.astimezone(bg.MSK).strftime('%Y-%m-%dT%H') + ':' + asset
                      message = '⚠️ ПРОВЕРКА НЕ УДАЛАСЬ · ' + asset + '\n' + error + '\n' + provenance['run_url']
                      receipt = notify_deliver(ledger, key, message, token, chat, now, {'kind': 'ERROR', 'source_run_id': run['id']}, sender)
                      result['deliveries'].append(receipt)
                      continue
                  result['assets'][asset] = {'status': status, 'contract': value['contract'], 'last_h1_msk': value['last_h1_msk']}
                  if status == 'NO_SIGNAL':
                      continue
                  key = 'signal:' + value['setup']['uid']
                  if status == 'ENTRY_CANCELLED':
                      message = '⚪ Вход отменён · ' + asset + ' · ' + value['contract'] + '\n'
                      message += 'Котировка ушла от уровня H1 более чем на 0,5 ATR либо отсутствует.\n' + provenance['run_url']
                  else:
                      message = notify_render_signal(value, provenance)
                  result['deliveries'].append(notify_deliver(ledger, key, message, token, chat, now, {'kind': status, 'source_run_id': run['id']}, sender))
              if any((v['status'] == 'DATA_ERROR' for v in result['assets'].values())):
                  result['status'] = 'DATA_ERRORS'
              return result

          def notify_main():
              directory = Path('telegram-evidence')
              directory.mkdir(exist_ok=True)
              now = datetime.now(timezone.utc).astimezone(bg.MSK)
              report = {'status': 'FAILED', 'checked_at_msk': now.isoformat(), 'orders_enabled': False, 'source': 'apim.moex.com', 'errors': [], 'notification': None}
              try:
                  api = NotifyAPI(os.environ.get('GH_TOKEN', ''))
                  ledger = NotifyLedger(api)
                  mode = os.environ.get('NOTIFY_MODE', 'test')
                  if mode == 'setup' or (mode == 'test' and (not os.environ.get('TELEGRAM_CHAT_ID', '').strip())):
                      report['notification'] = notify_setup(ledger, now)
                      report['status'] = 'CHAT_ID_SENT_PRIVATELY'
                  elif mode == 'test':
                      token, chat, fingerprint = notify_configuration()
                      report['notification'] = notify_test(ledger, token, chat, fingerprint, now)
                      report['status'] = 'TELEGRAM_VERIFIED'
                  elif mode == 'notify':
                      token, chat, fingerprint = notify_configuration()
                      event_id = os.environ.get('NOTIFY_EVENT_RUN_ID', '')
                      result = notify_publish(api, ledger, token, chat, fingerprint, now, int(event_id) if event_id else None)
                      report['notification'] = result
                      report['status'] = result['status']
                  else:
                      raise NotifyError('Unsupported NOTIFY_MODE')
              except Exception as exc:
                  report['errors'].append(notify_safe_error(exc))
              text = json.dumps(report, ensure_ascii=False, allow_nan=False, indent=2) + '\n'
              (directory / 'telegram-result.json').write_text(text)
              summary = '# BR/GOLD — Telegram\n\nСтатус: ' + report['status'] + '\n\n```json\n' + text + '```\n'
              (directory / 'summary.md').write_text(summary)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
              level = 'error' if report['status'] in ('FAILED', 'DATA_ERRORS') else 'notice'
              message = notify_safe_error(Exception(json.dumps(report, ensure_ascii=False, allow_nan=False, separators=(',', ':'))))
              print('::' + level + ' title=BR-GOLD Telegram::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'), flush=True)
              return 1 if report['status'] in ('FAILED', 'DATA_ERRORS') else 0
          NOTIFY_CODE_SHA256 = 'bce8cf3c8841932892627089c7ca7d9d5458d9bd7eddd9be150c9a88e61f13a3'
          sys.exit(notify_main())
          PY
      - name: Retain delivery receipts and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algopack-telegram-${{ github.run_id }}-${{ github.run_attempt }}
          path: telegram-evidence/
          if-no-files-found: warn
          retention-days: 30
